# Offline Python Builder worker message bundles.
#
# Two surfaces use the opb.* namespace:
#   1. The Vue UI (ui-src/src/i18n.ts) — opb.* keys it translates client-side.
#   2. This worker (the prose strings its Java handlers/services emit into the
#      {success, summary, ...} JSON-RPC envelope and into job logs).
#
# The first block below (opb.name .. opb.python.*) and the opb.nav.*/opb.deploy.*
# keys are SHARED with the UI message table — keep them in sync. The opb.msg.*
# keys are worker-only (envelope summaries / exception messages); the UI does
# not reference them.
#
# English is the default and the fallback; messages_zh.properties holds the
# Chinese mirror. Both files MUST keep identical key sets.
#
# Locale-neutral protocol tokens (DoctorService.Check id/value, e.g.
# "python_interpreter", "not_found", "supported") are NOT translated here — the
# UI maps them via opb.doctor.check.*/opb.doctor.value*. The worker returns them
# raw on purpose so the UI owns all user-facing language for doctor rows.

