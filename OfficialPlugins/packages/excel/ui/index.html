<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Excel Splitter</title></head><body><main><header><h1>Excel Splitter</h1><p>Choose a workbook, configure how to split it, then export the results.</p></header><ol class="steps"><li class="active">Source</li><li>Mode</li><li>Output</li><li>Run</li></ol><section><button id="pick">Choose workbook</button><strong id="file">No file selected</strong></section><section><label>Split mode<select id="mode"><option value="BY_SHEET">By sheet</option><option value="BY_COLUMN">By column value</option><option value="COMPLEX">Complex rules</option></select></label><label id="sheetWrap">Sheet<select id="sheet"></select></label><label id="columnWrap">Column<select id="column"></select></label></section><section class="actions"><button id="run" disabled>Split workbook</button><span id="status"></span></section></main><script type="module" src="app.js"></script></body></html>
