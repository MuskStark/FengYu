# ================================================================
# ZhiFlow-Api — 插件预览窗口(PluginPreviewWindow)内置中文文案。
# 这是兜底资源:预览运行在主程序内时,I18n 会先从主程序的
# i18n.messages 解析(键值相同);预览独立运行时回落到本文件,
# 这样界面显示正常中文而不是原始 key。
#
# 请与主程序文案保持同步:
# ZhiFlow/src/main/resources/i18n/messages_zh.properties
# ================================================================

