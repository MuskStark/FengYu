# ================================================================
# ZhiFlow-Api — built-in message bundle for the Plugin Preview
# Window (PluginPreviewWindow). This is a fallback: when the
# preview runs inside the host app, I18n resolves these keys from
# the host's i18n.messages bundle first (same keys, same values).
# When the preview runs standalone (third-party plugin authors),
# I18n falls back to THIS bundle so the UI shows real text instead
# of raw keys.
#
# Keep these keys/values in sync with the host bundle at
# ZhiFlow/src/main/resources/i18n/messages.properties.
# ================================================================

# ── Content area ──────────────────────────────────────────────
content.back=Back
content.search.prompt=Search tools...
