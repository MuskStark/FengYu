detail.tag.plugin=Plugin
detail.tag.builtin=Built-in
detail.prop.version=Version
detail.prop.type=Type
detail.prop.category=Category
detail.category.dev=Developer Tools
detail.category.text=Text Processing
detail.category.image=Image Processing
detail.category.net=Network Tools
detail.category.other=Other Tools

# ── Sidebar ───────────────────────────────────────────────────
sidebar.section.tools=TOOLS

# ── Status bar ────────────────────────────────────────────────
