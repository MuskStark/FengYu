name: Plugin Tooling Release

# Publishes the plugin toolchain: two Java artifacts (the Worker SDK and the devkit) to GitHub
# Packages, and the four npm packages (@infinia/plugin-sdk, @infinia/plugin-ui, @infinia/plugin-cli,
# @infinia/plugin-dev) to npm. Triggered by a `plugin-tooling-v*` tag or a manual dispatch with a
# version. The workflow is not marked successful until a clean external consumer can scaffold and
# build a plugin from the published packages.

on:
  push:
    tags: ['plugin-tooling-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Toolchain version to publish (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: plugin-tooling-release
  cancel-in-progress: false

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0 }
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: node toolchain/cli/scripts/resolve-tooling-version.mjs --input "$INPUT_VERSION" --ref "$REF_NAME" --github-output "$GITHUB_OUTPUT"

  verify:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            toolchain/sdk-ts/package-lock.json
            toolchain/ui/package-lock.json
            toolchain/dev/package-lock.json
            toolchain/cli/package-lock.json
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # SDK + dev plugin + CLI + UI tests.
      - run: cd toolchain/sdk-ts && npm ci && npm test
      - run: cd toolchain/dev && npm ci && npm test
      - run: cd toolchain/ui && npm ci && npm run typecheck && npm test && npm run build
      - run: cd toolchain/cli && npm ci && npm test
      # Test and install the Java SDK + DevKit, then build every official plugin through the CLI.
      - run: ./mvnw -pl toolchain/devkit-java -am install
      - run: node toolchain/cli/bin/fengyu.mjs plugin build OfficialPlugins/plugin-markdown
      - run: node toolchain/cli/bin/fengyu.mjs plugin build OfficialPlugins/plugin-excel
      - run: node toolchain/cli/bin/fengyu.mjs plugin build OfficialPlugins/plugin-email
      - run: node toolchain/cli/bin/fengyu.mjs plugin build OfficialPlugins/plugin-offlinepython
      - name: Verify npm package contents
        run: |
          (cd toolchain/cli && npm pack --ignore-scripts --dry-run --json) > cli-pack.json
          (cd toolchain/dev && npm pack --ignore-scripts --dry-run --json) > dev-pack.json
          (cd toolchain/sdk-ts && npm pack --ignore-scripts --dry-run --json) > sdk-pack.json
          (cd toolchain/ui && npm pack --ignore-scripts --dry-run --json) > ui-pack.json
          node toolchain/cli/scripts/assert-pack-contents.mjs cli-pack.json dev-pack.json sdk-pack.json ui-pack.json
      - run: scripts/plugin-tooling-local-smoke.sh
      - run: ./mvnw -pl FengYu -am package -DskipTests
      - run: scripts/e2e-smoke.sh
      - run: npm ci && npm run docs:build

  publish-java:
    needs: [resolve-version, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # Publish the independently-versioned Java artifacts (SDK + devkit) to GitHub Packages.
      # Credentials come from the GITHUB_ACTOR / GITHUB_TOKEN server settings;
      # generated files never contain a token.
      - name: Publish Java Worker SDK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          FENGYU_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -f toolchain/sdk-java/pom.xml deploy -DskipTests -s .mvn/release-settings.xml
      - name: Publish Java Plugin DevKit
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          FENGYU_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -f toolchain/devkit-java/pom.xml deploy -DskipTests -s .mvn/release-settings.xml

  publish-npm:
    needs: [resolve-version, publish-java]
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: |
            toolchain/sdk-ts/package-lock.json
            toolchain/ui/package-lock.json
            toolchain/dev/package-lock.json
            toolchain/cli/package-lock.json
      # Publish order respects the dependency graph: SDK → UI (peers SDK) → dev (peers SDK) → CLI.
      # Authentication is OIDC-based trusted publishing (no NPM_TOKEN): npm CLI exchanges
      # the GitHub OIDC JWT for a short-lived npm token when id-token: write is granted.
      - run: cd toolchain/sdk-ts && npm ci && npm publish --provenance --access public
      - run: cd toolchain/ui && npm ci && npm publish --provenance --access public
      - run: cd toolchain/dev && npm ci && npm publish --provenance --access public
      - run: cd toolchain/cli && npm ci && npm publish --provenance --access public

  consumer-smoke:
    needs: [resolve-version, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0 }
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: temurin, cache: maven }
      - name: Resolve the just-published CLI (eventually consistent registry)
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          for i in 1 2 3 4 5 6; do
            if npm view @infinia/plugin-cli@$VERSION >/dev/null 2>&1; then echo "resolved after $i tries"; exit 0; fi
            echo "attempt $i: not visible yet, waiting 20s"; sleep 20
          done
          echo "FAIL: @infinia/plugin-cli@$VERSION never became resolvable" >&2; exit 1
      - name: "Clean-consumer scaffold + build (no file: deps)"
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          FENGYU_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          cd "$(mktemp -d)"
          npx --yes @infinia/plugin-cli@$VERSION plugin create demo --id com.example.demo
          cd demo
          npx --yes @infinia/plugin-cli@$VERSION plugin build .
          test -f dist-package/com.example.demo-1.0.0.fyp
