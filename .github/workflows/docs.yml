name: Docs

on:
  push:
    branches: [main]
    # CHANGELOG.md participates: the docs build regenerates docs/{en,zh}/reference/
    # changelog.md from it (sync:changelog pre-hook), so a CHANGELOG-only push must
    # redeploy or the Pages mirror goes stale.
    paths: ['docs/**', 'CHANGELOG.md', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Before setup-node: its `cache: yarn` probe runs bare `yarn` in the
      # cache-dependency-path directory, and the runner images' global yarn
      # 1.22.22 refuses to run in a project pinning "packageManager" —
      # corepack must be enabled first so the probe resolves Yarn 4.18.0.
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: yarn
          cache-dependency-path: docs/yarn.lock
      - run: corepack yarn install --immutable
        working-directory: docs
      - run: corepack yarn run build
        working-directory: docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # The official site links docs at the dedicated subdomain —
  # https://docs.infinia.fyi/ — served by the dedicated infinia-docs Pages
  # project (custom domain docs.infinia.fyi, project root). Built with
  # --base=/ so internal links resolve at the domain root. Keep this project
  # SEPARATE from infinia-assets: Pages replaces the entire production tree
  # per publish, so sharing a project with the store SPA's hashed assets
  # would evict them.
  publish-infinia:
    if: ${{ vars.CF_PAGES_ENABLED == 'true' }}
    # The Cloudflare credentials live in the repo's "CloudFlare" environment
    # (CF_PAGES_TOKEN / CF_ACCOUNT_ID), so the job must declare it to see them.
    environment: CloudFlare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: yarn
          cache-dependency-path: docs/yarn.lock
      - run: corepack yarn install --immutable
        working-directory: docs
      - run: corepack yarn sync:changelog && corepack yarn exec vitepress build . --base=/
        working-directory: docs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_PAGES_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy docs/.vitepress/dist --project-name=infinia-docs --branch=main
