name: Docs

on:
  push:
    branches: [main, 'release/*']
    # CHANGELOG.md participates: the docs build regenerates docs/{en,zh}/reference/
    # changelog.md from it (sync:changelog pre-hook), so a CHANGELOG-only push must
    # redeploy or the Pages mirror goes stale.
    paths: ['docs/**', 'CHANGELOG.md', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Before setup-node: its `cache: yarn` probe runs bare `yarn` in the
      # cache-dependency-path directory, and the runner images' global yarn
      # 1.22.22 refuses to run in a project pinning "packageManager" —
      # corepack must be enabled first so the probe resolves Yarn 4.18.0.
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: yarn
          cache-dependency-path: docs/yarn.lock
      - run: corepack yarn install --immutable
        working-directory: docs
      - run: corepack yarn run build
        working-directory: docs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/.vitepress/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
