name: Backend CI

# Backend changes previously reached a release tag before the full Maven suite and end-to-end
# smoke ran. Keep those gates on ordinary branch pushes and PRs without asking a release job to
# be the first executor.

on:
  push:
    # 'release/*' wildcard covers every maintenance/release branch (release/4.0.0,
    # release/4.1.0, …) so a new release branch is CI-gated without editing this list.
    branches: ['main', '4.0.0', 'release/*']
    paths:
      - 'FengYu/**'
      - 'toolchain/sdk-java/**'
      - 'toolchain/devkit-java/**'
      - 'scripts/e2e-smoke.sh'
      - 'scripts/fixtures/**'
      - 'pom.xml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'FengYu/**'
      - 'toolchain/sdk-java/**'
      - 'toolchain/devkit-java/**'
      - 'scripts/e2e-smoke.sh'
      - 'scripts/fixtures/**'
      - 'pom.xml'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # Same bubblewrap/AppArmor bootstrap as fengyu-release.yml / uos-deb-build.yml /
      # windows-portable-build.yml — backend tests fail closed without a usable process
      # sandbox on ubuntu-latest (PluginProcessManagerTest hits the deliberate
      # fail-closed IllegalStateException when bwrap is missing or AppArmor blocks it).
      - name: Enable bubblewrap sandbox (install + relax Ubuntu 24.04 AppArmor userns)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind / / --proc /proc --dev-bind /dev /dev -- /bin/true

      - name: Run the full backend reactor tests
        run: ./mvnw -B test

  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Enable corepack before setup-node's packageManager probe
        run: corepack enable
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # Same bootstrap as the test job above and the release workflows — the smoke's
      # plugin-worker spawns fail closed without a usable process sandbox.
      - name: Enable bubblewrap sandbox (install + relax Ubuntu 24.04 AppArmor userns)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind / / --proc /proc --dev-bind /dev /dev -- /bin/true

      - name: Build frontend production bundle
        run: corepack yarn install --immutable && corepack yarn run build
        working-directory: frontend
      - name: Build shaded backend
        run: ./mvnw -B -pl FengYu -am package -DskipTests
      # The smoke builds its fixture plugin through the toolchain CLI, whose runtime
      # deps (ajv/yauzl) resolve from toolchain/cli's node_modules.
      - name: Install toolchain/cli deps (fixture plugin build)
        run: corepack yarn install --immutable
        working-directory: toolchain/cli
      - name: Boot JAR and probe REST/plugin/AI surfaces
        run: scripts/e2e-smoke.sh
