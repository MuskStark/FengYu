name: FengYu-Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v4.0.0 or v4.0.0-alpha.1)'
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'
      - 'v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+'
      - 'v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+'
      - 'v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+'

permissions:
  contents: write

jobs:
  # ==========================================================================
  # Setup — resolve version strings once, shared by all downstream jobs
  #   version:     full version string (e.g. "4.0.0-alpha.2") — for JAR/zip names
  #   app_version: numeric-only version (e.g. "4.0.0") — for jpackage/Info.plist
  # ==========================================================================
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      app_version: ${{ steps.resolve.outputs.app_version }}
      raw_tag: ${{ steps.resolve.outputs.raw_tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Resolve version strings
        id: resolve
        run: |
          RAW="${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW#v}"
          APP_VERSION=$(echo "$VERSION" | sed 's/-.*//')
          if [[ "$VERSION" == *"-alpha."* || "$VERSION" == *"-beta."* || "$VERSION" == *"-rc."* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "raw_tag=${RAW}              >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"          >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}"  >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}"    >> "$GITHUB_OUTPUT"
          echo "RAW_TAG=${RAW}  VERSION=${VERSION}  APP_VERSION=${APP_VERSION}  PRERELEASE=${PRERELEASE}"

  # ==========================================================================
  # Windows — two packages:
  #   1. FengYu-{ver}-windows-x64.zip       (no JRE, Launch4j .exe)
  #   2. FengYu-{ver}-windows-x64-jre.zip   (with bundled JRE, jpackage)
  # ==========================================================================
  build-windows:
    needs: setup
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      APP_VERSION: ${{ needs.setup.outputs.app_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (reactor: FengYu-Api + FengYu, shade JAR + Launch4j exe)
        shell: pwsh
        # Single reactor build from the parent pom (API is built first, app depends on it).
        # Replaces the old split `mvn install -f SwissKitJ-Api` + `mvn package -f SwissKit`.
        run: mvn clean package -DskipTests

      # --- Without JRE: Launch4j .exe (JAR embedded inside exe) ---
      - name: Package Windows (without JRE)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\FengYu | Out-Null
          Move-Item FengYu\target\FengYu.exe release\FengYu\FengYu.exe -Force
          Copy-Item README.md release\FengYu\
          Compress-Archive -Path release\FengYu -DestinationPath "release\FengYu-$env:VERSION-windows-x64.zip" -Force
          Write-Host "Created: release/FengYu-$env:VERSION-windows-x64.zip"

      # --- With JRE: jpackage app-image ---
      - name: Package Windows (with JRE)
        shell: pwsh
        run: |
          $jarFile = Get-ChildItem FengYu\target -Filter "FengYu-*.jar" | Select-Object -First 1
          if (-not $jarFile) {
            Write-Error "ERROR: No FengYu-*.jar found in FengYu\target\"
            exit 1
          }
          $jarName = $jarFile.Name
          $inputDir = "release\jpackage-input"
          New-Item -ItemType Directory -Force -Path $inputDir | Out-Null
          Copy-Item $jarFile.FullName $inputDir\

          jpackage --type app-image `
            --name FengYu `
            --input $inputDir `
            --main-jar $jarName `
            --main-class fan.summer.fengyu.Launcher `
            --dest release\with-jre `
            --java-options "-Xms64m -Xmx512m" `
            --icon FengYu\src\main\resources\icons\FengYu.ico `
            --vendor "FengYu" `
            --app-version "$env:APP_VERSION"

          Compress-Archive -Path release\with-jre\FengYu `
            -DestinationPath "release\FengYu-$env:VERSION-windows-x64-jre.zip" -Force
          Write-Host "Created: release/FengYu-$env:VERSION-windows-x64-jre.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: fengyu-windows
          path: |
            release/FengYu-${{ env.VERSION }}-windows-x64.zip
            release/FengYu-${{ env.VERSION }}-windows-x64-jre.zip
          retention-days: 30

  # ==========================================================================
  # macOS Apple Silicon — two packages:
  #   1. FengYu-{ver}-macos-arm64.zip       (no JRE, hand-crafted .app)
  #   2. FengYu-{ver}-macos-arm64-jre.zip   (with bundled JRE, jpackage)
  # ==========================================================================
  build-macos:
    needs: setup
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      APP_VERSION: ${{ needs.setup.outputs.app_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build fat JAR (reactor)
        run: mvn clean package -DskipTests

      # --- Without JRE: hand-crafted .app bundle with shell launcher ---
      - name: Create .app skeleton (without JRE)
        run: |
          JAR_FILE=$(find FengYu/target -maxdepth 1 -name "FengYu-*.jar" -type f | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No FengYu-*.jar found in FengYu/target/" >&2
            exit 1
          fi
          mkdir -p release/FengYu.app/Contents/MacOS
          mkdir -p release/FengYu.app/Contents/Resources
          cp "$JAR_FILE" release/FengYu.app/Contents/Resources/FengYu.jar
          cp FengYu/src/main/resources/icons/FengYu.icns release/FengYu.app/Contents/Resources/

      - name: Write macOS launcher (without JRE)
        run: |
          printf '%s\n' \
            '#!/bin/bash' \
            'SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"' \
            'RESOURCES_DIR="$SCRIPT_DIR/../Resources"' \
            '' \
            'JAVA_BIN=""' \
            'if [ -n "$JAVA_HOME" ] && [ -x "$JAVA_HOME/bin/java" ]; then' \
            '  JAVA_BIN="$JAVA_HOME/bin/java"' \
            'elif command -v java &>/dev/null; then' \
            '  JAVA_BIN="$(command -v java)"' \
            'elif [ -d "/Library/Java/JavaVirtualMachines" ]; then' \
            '  JVM_HOME=$(ls /Library/Java/JavaVirtualMachines/ 2>/dev/null | sort -r | head -1)' \
            '  CANDIDATE="/Library/Java/JavaVirtualMachines/${JVM_HOME}/Contents/Home/bin/java"' \
            '  if [ -x "$CANDIDATE" ]; then' \
            '    JAVA_BIN="$CANDIDATE"' \
            '  fi' \
            'fi' \
            '' \
            'if [ -z "$JAVA_BIN" ]; then' \
            '  osascript -e "display alert \"Java Not Found\" message \"FengYu requires Java 17 or later.\n\nDownload from https://adoptium.net/\" as critical"' \
            '  exit 1' \
            'fi' \
            '' \
            'exec "$JAVA_BIN" -jar "$RESOURCES_DIR/FengYu.jar" "$@"' \
            > release/FengYu.app/Contents/MacOS/FengYu
          chmod +x release/FengYu.app/Contents/MacOS/FengYu

      - name: Write Info.plist (without JRE)
        run: |
          INFO="release/FengYu.app/Contents/Info.plist"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'                                 > "$INFO"
          printf '%s\n' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"'                  >> "$INFO"
          printf '%s\n' '  "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'                   >> "$INFO"
          printf '%s\n' '<plist version="1.0">'                                                  >> "$INFO"
          printf '%s\n' '<dict>'                                                                  >> "$INFO"
          printf '%s\n' '  <key>CFBundleName</key>'                                              >> "$INFO"
          printf '%s\n' '  <string>FengYu</string>'                                             >> "$INFO"
          printf '%s\n' '  <key>CFBundleDisplayName</key>'                                       >> "$INFO"
          printf '%s\n' '  <string>FengYu</string>'                                             >> "$INFO"
          printf '%s\n' '  <key>CFBundleIdentifier</key>'                                        >> "$INFO"
          printf '%s\n' '  <string>com.muskstark.fengyu</string>'                               >> "$INFO"
          printf '%s\n' '  <key>CFBundleVersion</key>'                                           >> "$INFO"
          printf '%s\n' "  <string>${APP_VERSION}</string>"                                      >> "$INFO"
          printf '%s\n' '  <key>CFBundleShortVersionString</key>'                                >> "$INFO"
          printf '%s\n' "  <string>${APP_VERSION}</string>"                                      >> "$INFO"
          printf '%s\n' '  <key>CFBundlePackageType</key>'                                       >> "$INFO"
          printf '%s\n' '  <string>APPL</string>'                                                >> "$INFO"
          printf '%s\n' '  <key>CFBundleExecutable</key>'                                        >> "$INFO"
          printf '%s\n' '  <string>FengYu</string>'                                             >> "$INFO"
          printf '%s\n' '  <key>LSMinimumSystemVersion</key>'                                    >> "$INFO"
          printf '%s\n' '  <string>10.13</string>'                                               >> "$INFO"
          printf '%s\n' '  <key>NSHighResolutionCapable</key>'                                   >> "$INFO"
          printf '%s\n' '  <true/>'                                                              >> "$INFO"
          printf '%s\n' '  <key>LSUIElement</key>'                                               >> "$INFO"
          printf '%s\n' '  <false/>'                                                             >> "$INFO"
          printf '%s\n' '  <key>CFBundleIconFile</key>'                                          >> "$INFO"
          printf '%s\n' '  <string>FengYu.icns</string>'                                        >> "$INFO"
          printf '%s\n' '</dict>'                                                                 >> "$INFO"
          printf '%s\n' '</plist>'                                                                >> "$INFO"

      - name: Compress macOS package (without JRE)
        run: |
          cd release
          zip -ry "FengYu-${VERSION}-macos-arm64.zip" FengYu.app
          echo "Created: release/FengYu-${VERSION}-macos-arm64.zip"

      # --- With JRE: jpackage .app bundle ---
      - name: Package macOS (with JRE)
        run: |
          JAR_FILE=$(find FengYu/target -maxdepth 1 -name "FengYu-*.jar" -type f | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No FengYu-*.jar found in FengYu/target/" >&2
            exit 1
          fi
          mkdir -p release/jpackage-input
          cp "$JAR_FILE" release/jpackage-input/

          jpackage --type app-image \
            --name FengYu \
            --input release/jpackage-input \
            --main-jar "$(basename "$JAR_FILE")" \
            --main-class fan.summer.fengyu.Launcher \
            --dest release/with-jre \
            --java-options "-Xms64m -Xmx512m" \
            --icon FengYu/src/main/resources/icons/FengYu.icns \
            --vendor "FengYu" \
            --app-version "${APP_VERSION}" \
            --mac-package-identifier com.muskstark.fengyu

          cd release/with-jre
          zip -ry "../FengYu-${VERSION}-macos-arm64-jre.zip" FengYu.app
          echo "Created: release/FengYu-${VERSION}-macos-arm64-jre.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v5
        with:
          name: fengyu-macos
          path: |
            release/FengYu-${{ env.VERSION }}-macos-arm64.zip
            release/FengYu-${{ env.VERSION }}-macos-arm64-jre.zip
          retention-days: 30

  # ==========================================================================
  # Linux — four artifacts:
  #   1. FengYu-{ver}-linux-x64.zip         (no JRE, shell launcher)
  #   2. FengYu-{ver}-linux-x64-jre.zip     (with bundled JRE, jpackage)
  #   3. FengYu-UOS-{ver}-jre.zip           (UOS with JRE + .desktop)
  #   4. FengYu-UOS-{ver}-nojre.zip         (UOS without JRE + .desktop)
  #   5. FengYu-{ver}.jar                   (fat JAR, cross-platform)
  # ==========================================================================
  build-linux:
    needs: setup
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      APP_VERSION: ${{ needs.setup.outputs.app_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build fat JAR (reactor)
        run: mvn clean package -DskipTests

      # --- Without JRE: fat JAR + shell scripts ---
      - name: Assemble Linux package (without JRE)
        run: |
          JAR_FILE=$(find FengYu/target -maxdepth 1 -name "FengYu-*.jar" -type f | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No FengYu-*.jar found in FengYu/target/" >&2
            exit 1
          fi
          mkdir -p release/FengYu
          cp "$JAR_FILE" release/FengYu/FengYu.jar
          cp README.md release/FengYu/
          cp FengYu/src/main/resources/icons/icon-256.png release/FengYu/fengyu.png

          printf '%s\n' \
            '#!/bin/bash' \
            'SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' \
            'cd "$SCRIPT_DIR"' \
            '' \
            'JAVA_BIN=""' \
            'if [ -n "$JAVA_HOME" ] && [ -x "$JAVA_HOME/bin/java" ]; then' \
            '  JAVA_BIN="$JAVA_HOME/bin/java"' \
            'elif command -v java &>/dev/null; then' \
            '  JAVA_BIN="$(command -v java)"' \
            'fi' \
            '' \
            'if [ -z "$JAVA_BIN" ]; then' \
            '  echo "ERROR: Java 17 or later is required but was not found." >&2' \
            '  echo "Install: sudo apt install openjdk-17-jre" >&2' \
            '  exit 1' \
            'fi' \
            '' \
            'exec "$JAVA_BIN" -jar FengYu.jar "$@"' \
            > release/FengYu/run.sh
          chmod +x release/FengYu/run.sh

          cd release
          zip -r "FengYu-${VERSION}-linux-x64.zip" FengYu
          echo "Created: release/FengYu-${VERSION}-linux-x64.zip"

      # --- With JRE: jpackage app-image ---
      - name: Package Linux (with JRE)
        run: |
          JAR_FILE=$(find FengYu/target -maxdepth 1 -name "FengYu-*.jar" -type f | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No FengYu-*.jar found in FengYu/target/" >&2
            exit 1
          fi
          mkdir -p release/jpackage-input
          cp "$JAR_FILE" release/jpackage-input/

          jpackage --type app-image \
            --name FengYu \
            --input release/jpackage-input \
            --main-jar "$(basename "$JAR_FILE")" \
            --main-class fan.summer.fengyu.Launcher \
            --dest release/with-jre \
            --java-options "-Xms64m -Xmx512m" \
            --icon FengYu/src/main/resources/icons/icon-256.png \
            --vendor "FengYu" \
            --app-version "${APP_VERSION}"

          cd release/with-jre
          zip -r "../FengYu-${VERSION}-linux-x64-jre.zip" FengYu
          echo "Created: release/FengYu-${VERSION}-linux-x64-jre.zip"

      # --- UOS with JRE: jpackage app-image + .desktop launcher ---
      - name: Package Linux UOS (with JRE + .desktop)
        run: |
          JAR_FILE=$(find FengYu/target -maxdepth 1 -name "FengYu-*.jar" -type f | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No FengYu-*.jar found in FengYu/target/" >&2
            exit 1
          fi
          mkdir -p release/jpackage-input-uos
          cp "$JAR_FILE" release/jpackage-input-uos/

          jpackage --type app-image \
            --name FengYu \
            --input release/jpackage-input-uos \
            --main-jar "$(basename "$JAR_FILE")" \
            --main-class fan.summer.fengyu.Launcher \
            --dest release/uos-jre/FengYu-UOS \
            --java-options "-Xms64m -Xmx512m" \
            --icon FengYu/src/main/resources/icons/icon-256.png \
            --vendor "FengYu" \
            --app-version "${APP_VERSION}"

          cp FengYu/src/main/resources/icons/icon-256.png release/uos-jre/FengYu-UOS/fengyu.png
          cp README.md release/uos-jre/FengYu-UOS/

          printf '%s\n' \
            '#!/bin/bash' \
            'set -e' \
            'INSTALL_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' \
            '' \
            'echo "正在安装 FengYu 桌面入口..."' \
            '' \
            'cat > "$INSTALL_DIR/fengyu.desktop" << DESKTOP' \
            '[Desktop Entry]' \
            'Version=1.0' \
            'Name=FengYu' \
            'Name[zh_CN]=FengYu' \
            'Comment=FengYu Desktop Toolbox' \
            'Comment[zh_CN]=高效生产力工具集' \
            'Exec=$INSTALL_DIR/FengYu/bin/FengYu' \
            'Icon=$INSTALL_DIR/fengyu.png' \
            'Terminal=false' \
            'Type=Application' \
            'Categories=Office;Utility;' \
            'StartupNotify=true' \
            'X-Deepin-Vendor=fan.summer.fengyu' \
            'DESKTOP' \
            '' \
            'mkdir -p "$HOME/.local/share/applications"' \
            'cp "$INSTALL_DIR/fengyu.desktop" "$HOME/.local/share/applications/"' \
            '' \
            'if command -v update-desktop-database &>/dev/null; then' \
            '  update-desktop-database "$HOME/.local/share/applications/" 2>/dev/null || true' \
            'fi' \
            '' \
            'echo "FengYu 安装完成，在启动器中即可找到。"' \
            'echo "如未立即显示图标，请注销后重新登录。"' \
            > release/uos-jre/FengYu-UOS/install.sh
          chmod +x release/uos-jre/FengYu-UOS/install.sh

          cd release/uos-jre
          zip -r "../FengYu-UOS-${VERSION}-jre.zip" FengYu-UOS
          echo "Created: release/FengYu-UOS-${VERSION}-jre.zip"

      # --- UOS without JRE: fat JAR + .desktop launcher ---
      - name: Package Linux UOS (without JRE + .desktop)
        run: |
          JAR_FILE=$(find FengYu/target -maxdepth 1 -name "FengYu-*.jar" -type f | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No FengYu-*.jar found in FengYu/target/" >&2
            exit 1
          fi
          mkdir -p release/uos-nojre/FengYu-UOS
          cp "$JAR_FILE" release/uos-nojre/FengYu-UOS/FengYu.jar
          cp README.md release/uos-nojre/FengYu-UOS/
          cp FengYu/src/main/resources/icons/icon-256.png release/uos-nojre/FengYu-UOS/fengyu.png

          printf '%s\n' \
            '#!/bin/bash' \
            'SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' \
            'cd "$SCRIPT_DIR"' \
            '' \
            'JAVA_BIN=""' \
            'if [ -n "$JAVA_HOME" ] && [ -x "$JAVA_HOME/bin/java" ]; then' \
            '  JAVA_BIN="$JAVA_HOME/bin/java"' \
            'elif command -v java &>/dev/null; then' \
            '  JAVA_BIN="$(command -v java)"' \
            'fi' \
            '' \
            'if [ -z "$JAVA_BIN" ]; then' \
            '  echo "ERROR: Java 17 or later is required but was not found." >&2' \
            '  echo "Install: sudo apt install openjdk-17-jre" >&2' \
            '  exit 1' \
            'fi' \
            '' \
            'exec "$JAVA_BIN" -jar FengYu.jar "$@"' \
            > release/uos-nojre/FengYu-UOS/run.sh
          chmod +x release/uos-nojre/FengYu-UOS/run.sh

          printf '%s\n' \
            '#!/bin/bash' \
            'set -e' \
            'INSTALL_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' \
            '' \
            'echo "正在安装 FengYu 桌面入口..."' \
            '' \
            'cat > "$INSTALL_DIR/fengyu.desktop" << DESKTOP' \
            '[Desktop Entry]' \
            'Version=1.0' \
            'Name=FengYu' \
            'Name[zh_CN]=FengYu' \
            'Comment=FengYu Desktop Toolbox' \
            'Comment[zh_CN]=高效生产力工具集' \
            'Exec=$INSTALL_DIR/run.sh' \
            'Icon=$INSTALL_DIR/fengyu.png' \
            'Terminal=false' \
            'Type=Application' \
            'Categories=Office;Utility;' \
            'StartupNotify=true' \
            'X-Deepin-Vendor=fan.summer.fengyu' \
            'DESKTOP' \
            '' \
            'mkdir -p "$HOME/.local/share/applications"' \
            'cp "$INSTALL_DIR/fengyu.desktop" "$HOME/.local/share/applications/"' \
            '' \
            'if command -v update-desktop-database &>/dev/null; then' \
            '  update-desktop-database "$HOME/.local/share/applications/" 2>/dev/null || true' \
            'fi' \
            '' \
            'echo "FengYu 安装完成，在启动器中即可找到。"' \
            'echo "如未立即显示图标，请注销后重新登录。"' \
            > release/uos-nojre/FengYu-UOS/install.sh
          chmod +x release/uos-nojre/FengYu-UOS/install.sh

          cd release/uos-nojre
          zip -r "../FengYu-UOS-${VERSION}-nojre.zip" FengYu-UOS
          echo "Created: release/FengYu-UOS-${VERSION}-nojre.zip"

      # --- Fat JAR ---
      - name: Stage fat JAR
        run: |
          JAR_FILE=$(find FengYu/target -maxdepth 1 -name "FengYu-*.jar" -type f | head -1)
          cp "$JAR_FILE" "release/FengYu-${VERSION}.jar"
          echo "Staged: release/FengYu-${VERSION}.jar"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v5
        with:
          name: fengyu-linux
          path: |
            release/FengYu-${{ env.VERSION }}-linux-x64.zip
            release/FengYu-${{ env.VERSION }}-linux-x64-jre.zip
            release/FengYu-UOS-${{ env.VERSION }}-jre.zip
            release/FengYu-UOS-${{ env.VERSION }}-nojre.zip
          retention-days: 30

      - name: Upload fat JAR
        uses: actions/upload-artifact@v5
        with:
          name: fengyu-fatjar
          path: release/FengYu-${{ env.VERSION }}.jar
          retention-days: 30

  # ==========================================================================
  # Create GitHub Release — collects all artifacts into a single release
  # ==========================================================================
  create-release:
    needs: [setup, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      RAW_TAG: ${{ needs.setup.outputs.raw_tag }}
      PRERELEASE: ${{ needs.setup.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lh artifacts/

      - name: Determine pre-release label and warning
        id: prerelease
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            echo "label= (Pre-release)" >> "$GITHUB_OUTPUT"
            echo "warning=> ⚠️ This is a pre-release version. Use with caution and please report any bugs!" >> "$GITHUB_OUTPUT"
          else
            echo "label="    >> "$GITHUB_OUTPUT"
            echo "warning="  >> "$GITHUB_OUTPUT"
          fi

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum *.zip *.jar > checksums.txt 2>/dev/null || true
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RAW_TAG }}
          name: FengYu ${{ env.VERSION }}${{ steps.prerelease.outputs.label }}
          body: |
            ## FengYu ${{ env.VERSION }}${{ steps.prerelease.outputs.label }}

            ${{ steps.prerelease.outputs.warning }}

            ### Downloads

            #### With JRE (no Java installation required — extract and run)
            | Platform | File |
            |---|---|
            | Windows 10/11 x64 | `FengYu-${{ env.VERSION }}-windows-x64-jre.zip` |
            | Linux x64 | `FengYu-${{ env.VERSION }}-linux-x64-jre.zip` |
            | Linux UOS (统信) | `FengYu-UOS-${{ env.VERSION }}-jre.zip` |
            | macOS Apple Silicon | `FengYu-${{ env.VERSION }}-macos-arm64-jre.zip` |

            #### Without JRE (requires Java 17+)
            | Platform | File | How to run |
            |---|---|---|
            | Windows 10/11 x64 | `FengYu-${{ env.VERSION }}-windows-x64.zip` | Extract, double-click `FengYu.exe` |
            | Linux x64 | `FengYu-${{ env.VERSION }}-linux-x64.zip` | Extract, run `./run.sh` |
            | Linux UOS (统信) | `FengYu-UOS-${{ env.VERSION }}-nojre.zip` | Extract, run `./install.sh` |
            | macOS Apple Silicon | `FengYu-${{ env.VERSION }}-macos-arm64.zip` | Extract, double-click `FengYu.app` |

            #### Fat JAR (requires Java 17+)
            `FengYu-${{ env.VERSION }}.jar` — `java -jar FengYu-${{ env.VERSION }}.jar`

            #### Java Installation (for no-JRE packages)
            - Windows: [Adoptium](https://adoptium.net/)
            - macOS: `brew install --cask temurin@17`
            - Linux (Debian/Ubuntu): `sudo apt install openjdk-17-jre`
            - Linux (Fedora/RHEL): `sudo dnf install java-17-openjdk`

            #### UOS (统信UOS)
            Both JRE and no-JRE variants include `install.sh` — extract and run it to register the `.desktop` entry in your application launcher.

            ### What's New
            See the [CHANGELOG](https://muskstark.github.io/SwissKitJ/#/changelog) for details.

            ---
            SHA-256 checksums are provided in `checksums.txt`.
            This release was automatically created by GitHub Actions.
          files: |
            artifacts/*.zip
            artifacts/*.jar
            artifacts/checksums.txt
          draft: false
          prerelease: ${{ needs.setup.outputs.prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
