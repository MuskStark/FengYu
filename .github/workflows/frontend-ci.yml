name: Frontend CI

# Frontend verification on source changes, in addition to the release gate.
# Includes the Vitest unit suite plus the production Vite build (CSP hash and
# emitted asset paths).
# Keep Node aligned with scripts/node-version.test.mjs and initialize corepack
# before setup-node's packageManager probe.

on:
  push:
    # 'release/*' wildcard covers every maintenance/release branch (release/4.0.0,
    # release/4.1.0, …) so a new release branch is CI-gated without editing this list.
    branches: ['main', '4.0.0', 'release/*']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Before setup-node: its `cache: yarn` probe runs bare `yarn` inside
      # frontend/, and the runner images' global yarn 1.22.22 refuses to execute
      # in a project whose package.json pins "packageManager" — corepack must be
      # enabled first so the probe (and later `corepack yarn ...`) resolve the
      # pinned Yarn 4.18.0.
      - name: Enable corepack (pinned Yarn 4)
        run: corepack enable

      - name: Set up Node 24.18.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.18.0'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install deps
        run: corepack yarn install --immutable
        working-directory: frontend

      - name: Typecheck (tsc)
        run: corepack yarn run typecheck
        working-directory: frontend

      - name: Vitest unit suite
        run: corepack yarn run test:unit
        working-directory: frontend

      - name: Production build
        run: corepack yarn run build
        working-directory: frontend
