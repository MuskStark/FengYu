name: Plugin Tooling

# Type-checks, tests, and builds the plugin SDK, the @infinia/plugin-ui Vue kit,
# the @infinia/plugin-cli, and runs the Playwright visual suite. Triggers only
# when the plugin tooling changes.

on:
  push:
    branches: [4.0.0-FengYu, main]
    paths:
      - 'plugin-ui/**'
      - 'plugin-cli/**'
      - 'plugin-sdk/**'
      - 'FengYu-Plugin-Sdk/**'
      - 'OfficialPlugins/**'
      - 'scripts/plugin-tooling-local-smoke.sh'
      - '.github/workflows/plugin-tooling.yml'
  pull_request:
    paths:
      - 'plugin-ui/**'
      - 'plugin-cli/**'
      - 'plugin-sdk/**'
      - 'FengYu-Plugin-Sdk/**'
      - 'OfficialPlugins/**'
      - 'scripts/plugin-tooling-local-smoke.sh'
      - '.github/workflows/plugin-tooling.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          # Cache by every committed lockfile under the three packages.
          # plugin-sdk/typescript and plugin-cli may not commit a lockfile; the
          # glob still matches the ones that exist (plugin-ui/vue).
          cache-dependency-path: |
            plugin-sdk/typescript/package-lock.json
            plugin-ui/vue/package-lock.json
            plugin-cli/package-lock.json

      # --- SDK: typecheck-free, vitest unit tests ---
      - run: cd plugin-sdk/typescript && npm ci && npm test
      - name: Verify TypeScript SDK in isolation
        run: |
          SDK_TMP="$(mktemp -d)"
          cp -R plugin-sdk/typescript/. "$SDK_TMP/"
          rm -rf "$SDK_TMP/node_modules"
          cd "$SDK_TMP"
          npm ci
          npm test

      # --- @infinia/plugin-ui: typecheck + unit tests + Vite build ---
      - run: cd plugin-ui/vue && npm ci && npm run typecheck && npm test && npm run build

      # --- @infinia/plugin-cli: node --test ---
      - run: cd plugin-cli && npm ci && npm test

      # --- Visual regression (Playwright) ---
      - run: npx playwright install --with-deps chromium
        working-directory: plugin-ui/vue
      - run: npm run test:visual
        working-directory: plugin-ui/vue

      # Upload visual diffs only when the suite fails, so reviewers can see the
      # changed snapshots without polluting green runs.
      - name: Upload visual diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            plugin-ui/vue/playwright-report
            plugin-ui/vue/e2e/workbench.spec.ts-snapshots
          if-no-files-found: ignore
          retention-days: 14

  # Build every official plugin through the CLI and upload the .fyp artifacts so
  # the downstream host smoke job can install real CLI-produced packages.
  official-plugins:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [markdown, excel, email]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: plugin-cli/package-lock.json
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # The Java SDK is independently versioned (1.0.0) but stays in the reactor,
      # so a local install makes it resolvable without a GitHub Packages token.
      - run: ./mvnw -pl FengYu-Plugin-Sdk install -DskipTests
      - run: npm ci
        working-directory: plugin-cli
      - run: node plugin-cli/bin/fengyu.mjs plugin build OfficialPlugins/plugin-${{ matrix.plugin }}
      - name: Upload .fyp
        uses: actions/upload-artifact@v4
        with:
          name: official-${{ matrix.plugin }}-fyp
          path: OfficialPlugins/plugin-${{ matrix.plugin }}/dist-package/*.fyp
          if-no-files-found: error

  local-consumer-smoke:
    needs: [build, official-plugins]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: npm }
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: temurin, cache: maven }
      - run: scripts/plugin-tooling-local-smoke.sh
