name: Plugin Tooling

# Type-checks, tests, and builds the plugin SDK, the @infinia/plugin-ui React kit,
# the @infinia/plugin-cli, and runs the Playwright visual suite. Triggers only
# when the plugin tooling changes. The toolchain packages install with Yarn 4
# (see the packageManager field in each package.json); corepack provides the
# pinned yarn release on the Node 24 runner. Official plugins live in the store
# repository — this CI exercises the CLI against the committed smoke fixture.

on:
  push:
    # 'release/*' wildcard covers every maintenance/release branch (release/4.0.0,
    # release/4.1.0, …) so a new release branch is CI-gated without editing this list.
    branches: ['main', '4.0.0', 'release/*']
    paths:
      - 'toolchain/**'
      - 'scripts/fixtures/smoke-plugin/**'
      - 'scripts/plugin-tooling-local-smoke.sh'
      - '.github/workflows/toolchain-ci.yml'
      - '.github/workflows/toolchain-release.yml'
  pull_request:
    paths:
      - 'toolchain/**'
      - 'scripts/fixtures/smoke-plugin/**'
      - 'scripts/plugin-tooling-local-smoke.sh'
      - '.github/workflows/toolchain-ci.yml'
      - '.github/workflows/toolchain-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Before setup-node: its `cache: yarn` probe runs bare `yarn` in each
      # cache-dependency-path directory, and the runner images' global yarn
      # 1.22.22 refuses to run in a project pinning "packageManager" —
      # corepack must be enabled first so the probe resolves Yarn 4.18.0.
      - run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: yarn
          # Cache by every committed lockfile across the yarn-managed packages.
          cache-dependency-path: |
            toolchain/sdk-ts/yarn.lock
            toolchain/ui/yarn.lock
            toolchain/dev/yarn.lock
            toolchain/cli/yarn.lock

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache: false

      # --- SDK: typecheck-free, vitest unit tests ---
      - run: cd toolchain/sdk-ts && yarn install --immutable && yarn test
      - name: Verify TypeScript SDK in isolation
        run: |
          SDK_TMP="$(mktemp -d)"
          cp -R toolchain/sdk-ts/. "$SDK_TMP/"
          rm -rf "$SDK_TMP/node_modules"
          cd "$SDK_TMP"
          yarn install --immutable
          yarn test

      # --- @infinia/plugin-ui: typecheck + unit tests + Vite build ---
      - run: cd toolchain/ui && yarn install --immutable && yarn run typecheck && yarn test && yarn run build

      # --- @infinia/plugin-cli: node --test ---
      # The suite validates the committed smoke fixture (manifest-first, static UI) — no
      # `mvnw generate-resources` run, so no ~/.m2 SDK artifacts are needed here. The
      # devkit's own tests below build sdk-java through the reactor.
      - run: cd toolchain/cli && yarn install --immutable && yarn test

      # --- Dependency-free Python + Go Worker SDK contracts ---
      - run: PYTHONPATH=toolchain/sdk-python python -m unittest discover -s toolchain/sdk-python/tests -v
      - run: go test ./...
        working-directory: toolchain/sdk-go

      # --- IDE development bridge + Java SDK/DevKit contracts ---
      - run: cd toolchain/dev && yarn install --immutable && yarn test
      - run: ./mvnw -pl toolchain/devkit-java -am test

      # --- Visual regression (Playwright) ---
      - run: npx playwright install --with-deps chromium
        working-directory: toolchain/ui
      # Non-gating: this suite has never passed on linux CI. The committed
      # baselines are darwin-only (Playwright suffixes snapshots with the
      # generating platform), and the linux chromium build renders the
      # workbench's form controls at slightly different colors, flagging
      # pixel diffs the same DOM passes on darwin. Keep the run + diff
      # artifacts for inspection; re-gate once linux baselines exist
      # (run --update-snapshots on linux and commit the -chromium-linux.png set).
      - run: yarn run test:visual
        working-directory: toolchain/ui
        continue-on-error: true

      # Upload visual diffs only when the suite fails, so reviewers can see the
      # changed snapshots without polluting green runs.
      - name: Upload visual diff report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            toolchain/ui/playwright-report
            toolchain/ui/e2e/workbench.spec.ts-snapshots
          if-no-files-found: ignore
          retention-days: 14

  # Build the committed smoke-fixture plugin through the CLI (the manifest-first +
  # static-UI project shape the official-plugin matrix used to cover), then run the
  # local consumer smoke (scaffold → dev → check → build with the packed toolchain).
  local-consumer-smoke:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Before setup-node (yarn-1 cache probe — see the build job above).
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: yarn
          cache-dependency-path: |
            toolchain/sdk-ts/yarn.lock
            toolchain/ui/yarn.lock
            toolchain/dev/yarn.lock
            toolchain/cli/yarn.lock
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { java-version: '21', distribution: temurin, cache: maven }
      - name: Build the smoke-fixture plugin (.fyp via toolchain/cli)
        run: |
          cd toolchain/cli && yarn install --immutable
          cd "$GITHUB_WORKSPACE"
          node toolchain/cli/bin/fengyu.mjs build scripts/fixtures/smoke-plugin
          test -f scripts/fixtures/smoke-plugin/dist/dev.fengyu.smoke-1.0.0.fyp
      - run: scripts/plugin-tooling-local-smoke.sh
