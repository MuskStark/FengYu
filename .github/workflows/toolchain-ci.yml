name: Plugin Tooling

# Type-checks, tests, and builds the plugin SDK, the @infinia/plugin-ui Vue kit,
# the @infinia/plugin-cli, and runs the Playwright visual suite. Triggers only
# when the plugin tooling changes. The toolchain + official plugins install with
# Yarn 4 (see the packageManager field in each package.json); corepack provides
# the pinned yarn release on the Node 24 runner.

on:
  push:
    branches: [4.0.0, main]
    paths:
      - 'toolchain/**'
      - 'OfficialPlugins/**'
      - 'scripts/plugin-tooling-local-smoke.sh'
      - 'scripts/check-plugin-dependency-boundaries.sh'
      - '.github/workflows/toolchain-ci.yml'
      - '.github/workflows/toolchain-release.yml'
  pull_request:
    paths:
      - 'toolchain/**'
      - 'OfficialPlugins/**'
      - 'scripts/plugin-tooling-local-smoke.sh'
      - 'scripts/check-plugin-dependency-boundaries.sh'
      - '.github/workflows/toolchain-ci.yml'
      - '.github/workflows/toolchain-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: yarn
          # Cache by every committed lockfile across the yarn-managed packages.
          cache-dependency-path: |
            toolchain/sdk-ts/yarn.lock
            toolchain/ui/yarn.lock
            toolchain/dev/yarn.lock
            toolchain/cli/yarn.lock

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - run: corepack enable

      # --- SDK: typecheck-free, vitest unit tests ---
      - run: cd toolchain/sdk-ts && yarn install --immutable && yarn test
      - name: Verify TypeScript SDK in isolation
        run: |
          SDK_TMP="$(mktemp -d)"
          cp -R toolchain/sdk-ts/. "$SDK_TMP/"
          rm -rf "$SDK_TMP/node_modules"
          cd "$SDK_TMP"
          yarn install --immutable
          yarn test

      # --- @infinia/plugin-ui: typecheck + unit tests + Vite build ---
      - run: cd toolchain/ui && yarn install --immutable && yarn run typecheck && yarn test && yarn run build

      # --- @infinia/plugin-cli: node --test ---
      - run: cd toolchain/cli && yarn install --immutable && yarn test

      # --- IDE development bridge + Java SDK/DevKit contracts ---
      - run: cd toolchain/dev && yarn install --immutable && yarn test
      - run: ./mvnw -pl toolchain/devkit-java -am test
      - run: scripts/check-plugin-dependency-boundaries.sh

      # --- Visual regression (Playwright) ---
      - run: npx playwright install --with-deps chromium
        working-directory: toolchain/ui
      - run: yarn run test:visual
        working-directory: toolchain/ui

      # Upload visual diffs only when the suite fails, so reviewers can see the
      # changed snapshots without polluting green runs.
      - name: Upload visual diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            toolchain/ui/playwright-report
            toolchain/ui/e2e/workbench.spec.ts-snapshots
          if-no-files-found: ignore
          retention-days: 14

  # Build every official plugin through the CLI and upload the .fyp artifacts so
  # the downstream host smoke job can install real CLI-produced packages.
  official-plugins:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [markdown, excel, email, offlinepython]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: yarn
          cache-dependency-path: |
            toolchain/ui/yarn.lock
            toolchain/cli/yarn.lock
            OfficialPlugins/plugin-${{ matrix.plugin }}/ui-src/yarn.lock
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: corepack enable
      # The Java SDK is independently versioned (1.0.0) but stays in the reactor,
      # so a local install makes it resolvable without a GitHub Packages token.
      - run: ./mvnw -pl toolchain/sdk-java install -DskipTests
      # The plugins link @infinia/plugin-ui at toolchain/ui and its package entry
      # resolves to ./dist/index.js — dist/ is gitignored, so build it here first.
      - run: cd toolchain/ui && yarn install --immutable && yarn run build
      - run: cd toolchain/cli && yarn install --immutable
      - run: node toolchain/cli/bin/fengyu.mjs build OfficialPlugins/plugin-${{ matrix.plugin }}
      - name: Upload .fyp
        uses: actions/upload-artifact@v4
        with:
          name: official-${{ matrix.plugin }}-fyp
          path: OfficialPlugins/plugin-${{ matrix.plugin }}/dist/*.fyp
          if-no-files-found: error

  local-consumer-smoke:
    needs: [build, official-plugins]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: yarn
          cache-dependency-path: |
            toolchain/sdk-ts/yarn.lock
            toolchain/ui/yarn.lock
            toolchain/dev/yarn.lock
            toolchain/cli/yarn.lock
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: temurin, cache: maven }
      - run: corepack enable
      - run: scripts/plugin-tooling-local-smoke.sh
