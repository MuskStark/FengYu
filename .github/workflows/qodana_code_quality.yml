#-------------------------------------------------------------------------------#
#            Discover all capabilities of Qodana in our documentation           #
#             https://www.jetbrains.com/help/qodana/about-qodana.html           #
#-------------------------------------------------------------------------------#

name: Qodana
on:
  workflow_dispatch:
  pull_request:
    # The JVM-community linter (qodana.yaml) analyzes Java only — skip the full
    # scan on docs/frontend-only PRs instead of burning a 60-minute run per push.
    paths:
      - 'FengYu/src/**'
      - 'toolchain/sdk-java/**'
      - 'toolchain/devkit-java/**'
      - 'pom.xml'
      - 'FengYu/pom.xml'
      - 'qodana.yaml'
      - '.github/workflows/qodana_code_quality.yml'
  push:
    branches:
      # Match the other CI workflows' branch set: the release/* lines carry
      # development — main-only would leave every branch push uncovered.
      - main
      - 'release/*'

concurrency:
  group: qodana-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    runs-on: ubuntu-latest
    # Full-repo analysis can hang on a wedged Gradle/JDK daemon; cap the burn.
    timeout-minutes: 60
    permissions:
      # Read-only scan: results go to the PR comment + checks, never to repo contents.
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@89eb4357efd2b52e639f3216e63edaf33b82622b # v2025.3.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          # When pr-mode is set to true, Qodana analyzes only the files that have been changed
          pr-mode: false
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          # Upload Qodana results (SARIF, other artifacts, logs) as an artifact to the job
          upload-result: false
          # quick-fixes available in Ultimate and Ultimate Plus plans
          push-fixes: 'none'