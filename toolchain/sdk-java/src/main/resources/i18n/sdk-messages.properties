# SDK-level fallback messages for the shared result envelope. These are shipped inside the
# plugin SDK jar and resolve through a dedicated PluginMessages (base name "i18n.sdk-messages")
# so they are independent of each plugin's own i18n/messages.properties bundle. A plugin never
# needs to define these keys; it only defines its own plugin-prefixed keys.
sdk.operationFailed=operation failed
sdk.pluginOperationFailed={0} operation failed
