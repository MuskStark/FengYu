# slf4j-simple logging configuration for plugin workers.
#
# A plugin worker's stdout is the newline-delimited JSON-RPC protocol pipe back to the
# host; any non-JSON line there corrupts the protocol. Logs therefore MUST go to stderr
# (slf4j-simple's default), where the host's plugin-<id>-stderr drain captures them and
# re-logs at INFO onto its own console + .fengyu/logs/fengyu.log. Never set logFile=System.out.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogNameShort=true

# Tame the framework noise that reaches workers transitively (POI/Fesod via the Excel
# plugin, MyBatis via the Email plugin). Plugin/application loggers stay at INFO above.
org.slf4j.simpleLogger.log.org.apache.poi=WARN
org.slf4j.simpleLogger.log.org.apache.fesod=WARN
org.slf4j.simpleLogger.log.org.apache.ibatis=WARN
org.slf4j.simpleLogger.log.org.mybatis=WARN
