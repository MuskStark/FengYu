[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fengyu-plugin-sdk"
version = "2.0.0"
description = "Dependency-free JSON-RPC Worker SDK for FengYu Python plugins"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }

[tool.hatch.build.targets.wheel]
packages = ["fengyu_plugin_sdk"]
