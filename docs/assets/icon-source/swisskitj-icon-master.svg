<?xml version="1.0" encoding="UTF-8"?>
<!-- ZhiFlow Application Icon
     White squircle container (rx proportional to 150-box rx=38, ~25.3% radius)
     + 4-color pinwheel blades (faithful to Google Apps Script structure)
     Canvas: 1024, blades scaled to sit with ~6% padding inside the squircle.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- White squircle background, subtle vertical gradient for depth -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0F2F5"/>
    </linearGradient>
    <!-- Soft inner shadow at edges to seat the blades -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" in="SourceAlpha"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Squircle clip: superellipse approximation via rounded rect rx=260 (~25.4% of 1024) -->
    <clipPath id="squircle"><rect width="1024" height="1024" rx="260" ry="260"/></clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- background -->
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- 4-color pinwheel blades, mapped from 150-unit source to 1024 canvas with padding.
         Original paths occupy ~x[27..120] y[37..111] of a 150 box.
         Scale factor 6.0 (150*6=900), translate to center: tx=62, ty=62 -->
    <g transform="translate(62,62) scale(6.0)" filter="url(#softShadow)">
      <!-- Red blade (bottom horizontal) -->
      <path fill="#E53935" d="M27.6,99.9c0-6.1,4.9-11,11-11h53.9c6.1,0,11,4.9,11,11c0,6.1-4.9,11-11,11H38.7C32.6,111,27.6,106,27.6,99.9z M38.7,105.2c2.9,0,5.3-2.4,5.3-5.3s-2.4-5.3-5.3-5.3c-2.9,0-5.3,2.4-5.3,5.3S35.7,105.2,38.7,105.2z M92.6,105.2c2.9,0,5.3-2.4,5.3-5.3s-2.4-5.3-5.3-5.3c-2.9,0-5.3,2.4-5.3,5.3S89.6,105.2,92.6,105.2z"/>
      <!-- Yellow blade (diagonal) -->
      <path fill="#FBC02D" d="M40,61.8c3.6-4.9,10.5-6,15.4-2.4L99.1,91c4.9,3.6,6,10.5,2.4,15.4c-3.6,4.9-10.5,6-15.4,2.4L42.5,77.2C37.6,73.6,36.5,66.7,40,61.8z M45.8,72.5c2.4,1.7,5.7,1.2,7.4-1.2c1.7-2.4,1.2-5.7-1.2-7.4s-5.7-1.2-7.4,1.2C42.9,67.5,43.5,70.8,45.8,72.5z M89.5,104.2c2.4,1.7,5.7,1.2,7.4-1.2c1.7-2.4,1.2-5.7-1.2-7.4c-2.4-1.7-5.7-1.2-7.4,1.2S87.1,102.5,89.5,104.2z"/>
      <!-- Green blade (vertical) -->
      <path fill="#4CAF50" d="M72.5,38.2c5.8-1.9,12,1.3,13.9,7.1l16.7,51.3c1.9,5.8-1.3,12-7.1,13.9c-5.8,1.9-12-1.3-13.9-7.1L65.4,52.1C63.6,46.3,66.7,40.1,72.5,38.2z M70.9,50.3c0.9,2.8,3.9,4.3,6.7,3.4c2.8-0.9,4.3-3.9,3.4-6.7c-0.9-2.8-3.9-4.3-6.7-3.4C71.5,44.5,70,47.5,70.9,50.3z M87.5,101.6c0.9,2.8,3.9,4.3,6.7,3.4c2.8-0.9,4.3-3.9,3.4-6.7c-0.9-2.8-3.9-4.3-6.7-3.4C88.1,95.8,86.6,98.8,87.5,101.6z"/>
      <!-- Blue blade (diagonal) -->
      <path fill="#1E88E5" d="M113.7,38.5c5.8,2,8.8,8.3,6.8,14l-17.5,51c-2,5.8-8.3,8.8-14,6.8c-5.8-2-8.8-8.3-6.8-14l17.6-51C101.7,39.6,108,36.6,113.7,38.5z M105.1,47.2c-1,2.8,0.5,5.8,3.3,6.7c2.8,1,5.8-0.5,6.7-3.3c1-2.8-0.5-5.8-3.3-6.7S106.1,44.5,105.1,47.2z M87.6,98.2c-1,2.8,0.5,5.8,3.3,6.7c2.8,1,5.8-0.5,6.7-3.3c1-2.8-0.5-5.8-3.3-6.7C91.5,94,88.5,95.4,87.6,98.2z"/>
    </g>
  </g>
</svg>
