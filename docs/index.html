<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SwissKitJ Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="SwissKitJ — a modular desktop toolbox built with JavaFX">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'SwissKitJ',
      repo: 'https://github.com/MuskStark/SwissKitJ',
      coverpage: true,
      themeColor: '#3F51B5',
      loadSidebar: true,
      maxLevel: 4,
      subMaxLevel: 3,
      search: { placeholder: 'Search docs', noData: 'No results' },
      alias: {
        '/_sidebar.md': '/_sidebar.md',
        '/zh/_sidebar.md': '/zh/_sidebar.md',
        '/plugins/_sidebar.md': '/plugins/_sidebar.md',
        '/zh/plugins/_sidebar.md': '/zh/plugins/_sidebar.md',
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.max.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-plugin-flexible-i18n@1/dist/docsify-plugin-flexible-i18n.js"></script>
</body>
</html>
