<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Infinia Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Infinia — a modular desktop toolbox built with JavaFX">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Infinia',
      repo: 'https://github.com/MuskStark/FengYu',
      themeColor: '#3F51B5',
      loadSidebar: true,
      loadNavbar: true,
      maxLevel: 4,
      subMaxLevel: 3,

      // Multiple covers — docsify loads /_coverpage.md and /zh/_coverpage.md
      // based on the current URL prefix
      coverpage: ['/', '/zh/'],

      // Site name links to language-appropriate root
      nameLink: {
        '/zh/': '#/zh/',
        '/':    '#/'
      },

      // Per-language search placeholders
      search: {
        placeholder: {
          '/zh/': '搜索文档',
          '/':    'Search docs'
        },
        noData: {
          '/zh/': '没有结果',
          '/':    'No results'
        }
      },

      // If a Chinese page is requested but missing, fall back to English
      fallbackLanguages: ['zh']
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
