<!DOCTYPE html>
<html lang data-platform="">
<head>
  <meta charset="UTF-8" />
  <!-- No external resources: inline styles, inline SVG, no network/font fetch.
       script-src 'unsafe-inline' is required because this page ships its own
       inline <script> below (the progress subscription) — there is no external
       script source, so the inline script IS the whole trusted surface. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:;" />
  <title>Infinia</title>
  <script>
    // Apply appearance before the first paint. The value comes from Electron's
    // last backend-confirmed theme cache; dark is the safe first-launch default.
    (function () {
      var match = /[?&]theme=(dark|light)/.exec(location.search);
      document.documentElement.setAttribute('data-theme', match ? match[1] : 'dark');
    })();
  </script>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --surface-high: #1c1c1c;
      --border: #2a2a2a;
      --text: #ededed;
      --text-dim: #a0a0a0;
      --accent: #ededed;
      --track: #262626;
      --radius: 16px;
    }
    :root[data-theme="light"] {
      --bg: #f7f7f7;
      --surface: #ffffff;
      --surface-high: #f0f0f0;
      --border: #e2e2e2;
      --text: #0d0d0d;
      --text-dim: #5a5a5a;
      --accent: #0d0d0d;
      --track: #e9e9e9;
    }
    html, body { margin: 0; height: 100%; background: transparent; }
    body {
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Microsoft YaHei", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      position: relative;
      overflow: hidden;
      width: 416px;
      min-height: 248px;
      padding: 34px 32px 30px;
      box-sizing: border-box;
      border-radius: var(--radius);
      background:
        radial-gradient(circle at 50% -35%, var(--surface-high) 0, transparent 58%),
        var(--surface);
      color: var(--text);
      /* Keep the edge inside the card. An outer shadow on a transparent,
         frameless BrowserWindow is rendered as a black rounded rectangle. */
      box-shadow: inset 0 0 0 1px var(--border);
      text-align: center;
    }
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow: inset 0 1px rgba(255, 255, 255, .06);
    }
    .logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;
      filter: drop-shadow(0 8px 18px rgba(10, 132, 255, .16));
    }
    .logo svg { width: 100%; height: 100%; display: block; }
    .brand { font-size: 19px; font-weight: 650; letter-spacing: 0.35px; }
    .brand .sub {
      display: block;
      font-size: 12px;
      font-weight: 400;
      color: var(--text-dim);
      margin-top: 4px;
      letter-spacing: 0;
    }
    .progress {
      margin-top: 27px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 11px;
    }
    .progress-track {
      width: 188px;
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--track);
    }
    .progress-bar {
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      animation: travel 1.35s cubic-bezier(.4, 0, .2, 1) infinite;
      transform-origin: left center;
    }
    @keyframes travel {
      0% { transform: translateX(-115%) scaleX(.65); opacity: .45; }
      48% { transform: translateX(115%) scaleX(1); opacity: 1; }
      100% { transform: translateX(350%) scaleX(.72); opacity: .45; }
    }
    .msg {
      min-height: 18px;
      font-size: 13px;
      color: var(--text-dim);
      transition: opacity 0.16s ease, transform 0.16s ease;
    }
    .msg.fade { opacity: 0; transform: translateY(2px); }
    @media (prefers-reduced-motion: reduce) {
      .progress-bar { animation-duration: 2.8s; }
      .msg { transition: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-hidden="true">
      <!-- Verbatim from assets/branding/infinia-app-icon.svg (512px master). -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <defs>
          <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#ffffff"/><stop offset="1" stop-color="#edf3ff"/>
          </linearGradient>
          <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#e8f8ff" stop-opacity=".94"/><stop offset=".24" stop-color="#64d2ff" stop-opacity=".78"/>
            <stop offset=".5" stop-color="#0a84ff" stop-opacity=".84"/><stop offset=".76" stop-color="#5e5ce6" stop-opacity=".84"/>
            <stop offset="1" stop-color="#af52de" stop-opacity=".76"/>
          </linearGradient>
          <linearGradient id="front" x1="0" y1="1" x2="1" y2="0">
            <stop stop-color="#64d2ff"/><stop offset=".48" stop-color="#0a84ff"/><stop offset="1" stop-color="#5e5ce6"/>
          </linearGradient>
        </defs>
        <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#tile)"/>
        <rect x="21" y="21" width="470" height="470" rx="107" fill="none" stroke="#fff" stroke-opacity=".86" stroke-width="3"/>
        <g transform="translate(0 2) scale(2)" fill="none" stroke-linecap="round">
          <path d="M128 128C100 79 43 70 34 119C25 169 84 193 128 128C172 63 231 87 222 137C213 186 156 177 128 128" stroke="url(#glass)" stroke-width="42"/>
          <path d="M128 120C100 71 43 62 34 111C25 161 84 185 128 120C172 55 231 79 222 129C213 178 156 169 128 120" stroke="#fff" stroke-opacity=".52" stroke-width="5"/>
          <path d="M89 174C105 163 117 145 128 128C141 108 151 90 169 80" stroke="url(#front)" stroke-opacity=".91" stroke-width="43"/>
          <path d="M95 164C110 152 119 138 128 125C141 105 151 90 165 83" stroke="#fff" stroke-opacity=".58" stroke-width="5"/>
        </g>
      </svg>
    </div>
    <div class="brand">
      <span id="brand-name">…</span>
      <span class="sub" id="brand-sub"></span>
    </div>
    <div class="progress">
      <span class="progress-track" aria-hidden="true"><span class="progress-bar"></span></span>
      <span class="msg" id="msg">…</span>
    </div>
  </div>
  <script>
    // Mirror of src/window/splash-i18n.ts MESSAGES/BRAND. Keep in sync.
    var MESSAGES = {
      zh: {
        'spawning': '正在启动蜂语…',
        'port-ready': '正在初始化服务…',
        'health-ready': '正在加载工作区…',
        'loading-ui': '即将就绪'
      },
      en: {
        'spawning': 'Starting FengYu…',
        'port-ready': 'Initializing service…',
        'health-ready': 'Loading workspace…',
        'loading-ui': 'Almost ready'
      }
    };
    var BRAND = {
      zh: { name: '蜂语', sub: 'Infinia · FengYu' },
      en: { name: 'Infinia', sub: 'FengYu · 蜂语' }
    };

    function pickLang(query) {
      var m = /[?&]lang=(zh|en)/.exec(query);
      return m ? m[1] : 'en';
    }

    var lang = pickLang(location.search);
    document.documentElement.setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en');
    if (window.process && window.process.platform === 'linux') {
      document.documentElement.setAttribute('data-platform', 'linux');
    }

    var brand = BRAND[lang];
    document.getElementById('brand-name').textContent = brand.name;
    document.getElementById('brand-sub').textContent = brand.sub;

    var msgEl = document.getElementById('msg');
    function setStage(stage, immediate) {
      var text = (MESSAGES[lang] && MESSAGES[lang][stage]) || MESSAGES.en[stage];
      if (msgEl.textContent === text) return;
      if (immediate) {
        msgEl.textContent = text;
        return;
      }
      msgEl.classList.add('fade');
      setTimeout(function () {
        msgEl.textContent = text;
        msgEl.classList.remove('fade');
      }, 180);
    }

    // Initial stage
    setStage('spawning', true);

    // Subscribe to main-process progress updates (splash-preload.ts).
    if (window.splash && typeof window.splash.onProgress === 'function') {
      window.splash.onProgress(function (p) { setStage(p.stage); });
    }
  </script>
</body>
</html>
