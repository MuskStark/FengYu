[package]
name = "fengyu-desktop"
version = "4.0.0"
description = "FengYu desktop shell — Tauri 2.0 window that sidecar-launches the Java backend"
authors = ["FengYu"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP for the /api/health readiness poll.
ureq = "2"

[features]
# Dev vs prod is decided at compile time by `debug_assertions` (see src/main.rs):
# `cargo tauri dev` is a debug build (backend external, no sidecar); `cargo tauri build` is a
# release build (spawns the bundled jar sidecar). No custom cfg is involved.
custom-protocol = ["tauri/custom-protocol"]
