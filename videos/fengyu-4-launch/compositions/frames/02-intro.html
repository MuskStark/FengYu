  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <style>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var DUR = 4.536;
      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0–~2.0s) — the name lands on the voice ─────────────────────
      // Kicker lights first (during 这就是 @0.00–0.35).
      tl.fromTo(
        '[id="02-intro-kicker"]',
        { opacity: 0, y: 14, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power2.out" },
        0.08
      );

      // 「蜂语 Infinia」 per-word placement (dynamic-content-sequencing, power3 long tail);
      // each word seats just as the voice finishes singing it (蜂语 ends 1.02, Infinia 1.91).
      // the real mark arrives above the wordmark (fade + scale, power3 long tail)
      tl.fromTo(
        '[id="02-intro-mark"]',
        { opacity: 0, scale: 0.86, filter: "blur(8px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.8, ease: "power3.out" },
        0.5
      );

      tl.fromTo(
        '[id="02-intro-w-cn"]',
        { opacity: 0, y: 80, filter: "blur(16px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "power3.out" },
        0.34
      );
      tl.fromTo(
        '[id="02-intro-w-en"]',
        { opacity: 0, y: 80, filter: "blur(16px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.0, ease: "power3.out" },
        0.95
      );

      // ── Scene 2 (~2.0–3.85s) — the one voltage + the category line ───────────
      // 1px mint rule draws under the kicker (svg-path-draw: measured dash, power2 pen).
      var rule = document.getElementById("02-intro-rule-line");
      var ruleLen = rule.getTotalLength() * 1.05;
      rule.style.strokeDasharray = String(ruleLen);
      rule.style.strokeDashoffset = String(ruleLen);
      tl.to(rule, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 2.05);

      // 「AI 原生编排平台」 per-word beneath the display, on the voice

      subWords.forEach(function (w) {
        tl.fromTo(
          w.id,
          { opacity: 0, y: 26, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" },
          w.at

      // The quietest frame of the film: the naming card holds dead still to the end.
      // No exit — the root transition owns what comes next.

      window.__timelines["02-intro"] = tl;
    })();
