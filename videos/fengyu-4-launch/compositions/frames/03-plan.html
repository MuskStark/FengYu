  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var DUR = 6.816;
      var $ = function (id) { return document.getElementById(id); };

      var tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: DUR }, 0); // full-span anchor

      // the ONE camera move — slow push toward the panel, settled before the hold
      tl.fromTo(
        $("03-plan-cam"),
        { scale: 1 },
        { scale: 1.028, duration: 5.9, ease: "power1.inOut", immediateRender: true },
        0
      );

      // — Scene 1 (0.0–2.0) — panel floats in; left column lands beneath the VO opener
      tl.fromTo(
        $("03-plan-panel"),
        { opacity: 0, y: 54, scale: 0.984 },
        { opacity: 1, y: 0, scale: 1, duration: 0.95, ease: "power3.out", immediateRender: true },
        0.02
      );
      tl.fromTo(
        $("03-plan-kicker"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out", immediateRender: true },
        0.3
      );
      tl.fromTo(
        $("03-plan-d1"),
        { yPercent: 112 },
        { yPercent: 0, duration: 0.9, ease: "power4.out", immediateRender: true },
        0.5
      );
      tl.fromTo(
        $("03-plan-d2"),
        { yPercent: 112 },
        { yPercent: 0, duration: 0.9, ease: "power4.out", immediateRender: true },
        0.7
      );
      tl.fromTo(
        $("03-plan-rule"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.7, ease: "power2.out", immediateRender: true },
        1.22
      );
      tl.fromTo(
        $("03-plan-meta"),
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out", immediateRender: true },
        1.42
      );

      // header status — typed PLANNING, bulk-swapped to RUNNING when the first step lands
      // (discrete-text-sequence: reverse-searched states, instant jumps, sin-square caret)
      var SEQ = [
        { t: 0.0, s: "" },
        { t: 0.86, s: "PL" },
        { t: 0.98, s: "PLA" },
        { t: 1.1, s: "PLANN" },
        { t: 1.26, s: "PLANNI" },
        { t: 1.44, s: "PLANNIN" },
        { t: 1.62, s: "PLANNING" },
        { t: 2.06, s: "RUNNING" }
      ];
      var RUNNING_T = 2.06;
      function textAt(seq, time) {
        for (var i = seq.length - 1; i >= 0; i--) {
          if (time >= seq[i].t) return seq[i].s;
        }
        return seq[0].s;
      }
      var statEl = $("03-plan-hstat");
      var statWrap = $("03-plan-hstatwrap");
      var caretEl = $("03-plan-hcaret");
      var statDriver = { t: 0 };
      tl.to(
        statDriver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            var t = statDriver.t;
            statEl.textContent = textAt(SEQ, t);
            statWrap.style.color = t >= RUNNING_T ? "#8fd6bd" : "rgba(237,237,237,0.62)";
            caretEl.style.opacity =
              t > 0.8 && t < 4.95 && Math.sin((t * Math.PI) / 0.3) > 0 ? "1" : "0";
          }
        },
        0
      );
      tl.fromTo(
        $("03-plan-hdot"),
        { scale: 0.3, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.2)", immediateRender: true },
        0.82
      );

      // — Scenes 2–5 (2.0–4.8) — one row per VO cue (读表 2.0 · 拆分 2.7 · 汇总 3.4 · 发送 4.1):
      //   spring-slide in → mint ring self-draws → on the NEXT cue the badge flips to a
      //   solid check (scale-swap + check draw + bounce) and the label settles dim.
      var ROWS = [
        { row: "03-plan-row1", ring: "03-plan-ring1", solid: "03-plan-solid1", check: "03-plan-check1", lab: "03-plan-lab1", enter: 2.02, flip: 2.6 },
        { row: "03-plan-row2", ring: "03-plan-ring2", solid: "03-plan-solid2", check: "03-plan-check2", lab: "03-plan-lab2", enter: 2.72, flip: 3.3 },
        { row: "03-plan-row3", ring: "03-plan-ring3", solid: "03-plan-solid3", check: "03-plan-check3", lab: "03-plan-lab3", enter: 3.42, flip: 4.0 },
        { row: "03-plan-row4", ring: "03-plan-ring4", solid: "03-plan-solid4", check: "03-plan-check4", lab: "03-plan-lab4", enter: 4.12, flip: 4.7 }
      ];
      var labs = [];
      ROWS.forEach(function (r) {
        var ring = $(r.ring);
        var ringLen = ring.getTotalLength();
        ring.style.strokeDasharray = String(ringLen);
        ring.style.strokeDashoffset = String(ringLen);

        var chk = $(r.check);
        var chkLen = chk.getTotalLength();
        chk.style.strokeDasharray = String(chkLen);
        chk.style.strokeDashoffset = String(chkLen);
        labs.push($(r.lab));

        tl.fromTo(
          $(r.row),
          { opacity: 0, y: 30, scale: 0.975 },
          { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)", immediateRender: true },
          r.enter
        );
        tl.to(ring, { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" }, r.enter + 0.06);

        tl.to(ring, { opacity: 0, duration: 0.12, ease: "power1.in" }, r.flip);
        tl.fromTo(
          $(r.solid),
          { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" },
          { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(2.1)", immediateRender: true },
          r.flip + 0.04
        );
        tl.to(chk, { strokeDashoffset: 0, duration: 0.26, ease: "power2.out" }, r.flip + 0.14);
        tl.to($(r.lab), { opacity: 0.62, duration: 0.45, ease: "power2.out" }, r.flip + 0.12);
      });

      // — status bar: counter ticks and rail steps on every completion, settles at 4/4
      var CSEQ = [
        { t: 0.0, s: "0/4" },
        { t: 2.64, s: "1/4" },
        { t: 3.34, s: "2/4" },
        { t: 4.04, s: "3/4" },
        { t: 4.74, s: "4/4" }
      ];
      var DONE_T = 4.74;
      var cntEl = $("03-plan-count");
      var cntDriver = { t: 0 };
      tl.to(
        cntDriver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            var t = cntDriver.t;
            cntEl.textContent = textAt(CSEQ, t);
            cntEl.style.color = t >= DONE_T ? "#8fd6bd" : "rgba(237,237,237,0.85)";
          }
        },
        0
      );
      var fill = $("03-plan-fill");
      tl.set(fill, { scaleX: 0 }, 0);
      tl.to(fill, { scaleX: 0.25, duration: 0.35, ease: "power2.out" }, 2.64);
      tl.to(fill, { scaleX: 0.5, duration: 0.35, ease: "power2.out" }, 3.34);
      tl.to(fill, { scaleX: 0.75, duration: 0.35, ease: "power2.out" }, 4.04);
      tl.to(fill, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 4.74);

      // — Scene 6 (4.8–6.5) — 「每一步都看得见」: the receipt. Count pops mint, chip
      //   「已完成」 springs in, the finished list lifts once (one-time emphasis, no loop),
      //   then the frame holds still.
      tl.to(cntEl, { scale: 1.16, duration: 0.12, ease: "power1.out" }, 5.06);
      tl.to(cntEl, { scale: 1, duration: 0.22, ease: "power2.out" }, 5.18);
      tl.fromTo(
        $("03-plan-chip"),
        { opacity: 0, scale: 0.6, y: 8 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.8)", immediateRender: true },
        5.06
      );
      labs.forEach(function (lab) {
        tl.to(lab, { opacity: 0.88, duration: 0.7, ease: "power2.out" }, 5.3);
      });
      tl.to(
        [$("03-plan-met1"), $("03-plan-met2"), $("03-plan-met3"), $("03-plan-met4")],
        { opacity: 0.58, duration: 0.7, ease: "power2.out" },
        5.3
      );
      tl.to(
        [$("03-plan-no1"), $("03-plan-no2"), $("03-plan-no3"), $("03-plan-no4")],
        { opacity: 0.48, duration: 0.7, ease: "power2.out" },
        5.3
      );

      window.__timelines["03-plan"] = tl;
    })();
  </script>
