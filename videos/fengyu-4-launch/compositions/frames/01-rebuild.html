  <div

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var DUR = 8.636;
      var $ = function (id) { return document.getElementById(id); };

      var tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: DUR }, 0); // full-span anchor

      // ── Scene 1 (0.0–1.2) — the monolith rises (SwissKit 3.x)
      tl.fromTo(
        $("01-rebuild-slab"),
        { opacity: 0, y: 34, scale: 0.97 },
        { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out", immediateRender: true },
        0.1
      );

      // ── Scene 2 (1.30–1.80) — 到此为止@1.36: tremble + cracks
      var slab = $("01-rebuild-slab");
      // decaying shake as an explicit x chain (no repeat/yoyo per the motion doctrine)
      [7, -6, 5, -4, 2, 0].forEach(function (dx, i) {
        tl.to(slab, { x: dx, duration: 0.075, ease: "power1.inOut" }, 1.3 + i * 0.075);
      });
      [["01-rebuild-crack1", 1.36], ["01-rebuild-crack2", 1.46]].forEach(function (c) {
        var el = $(c[0]);
        var len = el.getTotalLength();
        el.style.strokeDasharray = String(len);
        el.style.strokeDashoffset = String(len);
        tl.to(el, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, c[1]);
      });
      // the cracks die with the slab — nothing of the old frame survives the burst
      tl.to($("01-rebuild-cracks"), { opacity: 0, duration: 0.18, ease: "power1.out" }, 2.55);

      // ── Scene 3 (2.55–) — 内核@2.55: flash + EXPLODE (seamless slab→shards swap)
      tl.set(slab, { opacity: 0 }, 2.55);
      // white core pops and holds, the blue halo blooms and SUSTAINS ~1s — the flash is a beat, not a blink
      tl.fromTo($("01-rebuild-flash"), { opacity: 1, scale: 0.5 }, { scale: 2.6, duration: 0.95, ease: "power2.out", immediateRender: false }, 2.55);
      tl.fromTo($("01-rebuild-flash"), { opacity: 1 }, { opacity: 1, duration: 0.4, immediateRender: false }, 2.55);
      tl.to($("01-rebuild-flash"), { opacity: 0, duration: 0.55, ease: "power2.in" }, 2.95);
      tl.fromTo($("01-rebuild-flashcore"), { opacity: 1, scale: 0.3 }, { opacity: 0, scale: 1.7, duration: 0.45, ease: "power2.out", immediateRender: false }, 2.55);

      // 15 shards tile the slab, then fly outward (preset vectors, slow-mo long tails)
      var DEBRIS = $("01-rebuild-debris");
      var SHARDS = [
        [610, 300, 128, 92, -340, -250, -32], [742, 296, 150, 100, 420, -320, 26],
        [896, 302, 136, 88, -520, -180, -22], [1036, 296, 158, 96, 610, -260, 34],
        [1198, 300, 112, 90, -380, 300, 28], [612, 396, 142, 88, 460, 180, -26],
        [758, 400, 128, 96, -610, 140, 30], [890, 394, 150, 92, 520, 260, -36],
        [1044, 398, 122, 94, -430, -320, 24], [1170, 396, 140, 90, 640, 200, -28],
        [606, 488, 132, 92, 380, 360, -30], [742, 492, 148, 88, -560, 380, 26],
        [894, 490, 138, 94, 480, -360, -24], [1036, 488, 126, 96, -400, 340, 32],
        [1166, 490, 144, 90, 560, -300, -34]
      ];
      SHARDS.forEach(function (sd, i) {
        var el = document.createElement("div");
        el.className = "01-rebuild-shard";
        el.style.left = sd[0] + "px";
        el.style.top = sd[1] + "px";
        el.style.width = sd[2] + "px";
        el.style.height = sd[3] + "px";
        DEBRIS.appendChild(el);
        tl.set(el, { opacity: 1 }, 2.55);
        tl.to(el, {
          x: sd[4], y: sd[5], rotation: sd[6], opacity: 0,
          duration: 1.9 + (i % 4) * 0.25, ease: "power3.out",
        }, 2.55);
      });

      // one-shot particle burst — preset angle/speed table (no Math.random)
      var DOTS = [
        [0, 150, 3], [30, 210, 4], [70, 170, 3], [110, 240, 4], [150, 160, 3],
        [190, 220, 4], [230, 150, 3], [270, 200, 4], [310, 170, 3], [350, 230, 4],
        [15, 120, 3], [95, 130, 4], [175, 120, 3], [255, 140, 4], [335, 130, 3]
      ];
      DOTS.forEach(function (d, i) {
        var el = document.createElement("div");
        el.className = "01-rebuild-dot";
        var blue = i % 2 === 0;
        el.style.background = blue ? "rgba(41, 151, 255, 0.95)" : "rgba(245, 245, 247, 0.92)";
        var s = d[2];
        el.style.width = s + "px";
        el.style.height = s + "px";
        el.style.left = (950 - s / 2) + "px";
        el.style.top = (430 - s / 2) + "px";
        DEBRIS.appendChild(el);
        var rad = (d[0] * Math.PI) / 180;
        var dx = Math.cos(rad) * d[1] * 3.2;
        var dy = Math.sin(rad) * d[1] * 3.2;
        var dotDriver = { p: 0 };
        tl.to(dotDriver, {
          p: 1, duration: 1.4 + (i % 3) * 0.2, ease: "power3.out",
          onStart: function () { el.style.opacity = "1"; },
          onUpdate: function () {
            el.style.transform = "translate(" + dx * dotDriver.p + "px," + dy * dotDriver.p + "px)";
          },
          onComplete: function () { el.style.opacity = "0"; },
        }, 2.55);
      });

      // debris clears, the blue bloom grows through it
      tl.to($("01-rebuild-bloom"), { opacity: 1, duration: 1.6, ease: "power2.out" }, 3.6);

      // ── Scene 4 (5.7–) — the reveal: logo, wordmark, version, tag
      tl.fromTo(
        $("01-rebuild-mark"),
        { opacity: 0, scale: 0.84 },
        { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out", immediateRender: true },
        5.7
      );
      tl.fromTo(
        $("01-rebuild-w1"),
        { opacity: 0, y: 40 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", immediateRender: true },
        5.76
      );
      tl.fromTo(
        $("01-rebuild-w2"),
        { opacity: 0, y: 40 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", immediateRender: true },
        6.27
      );
      tl.fromTo(
        $("01-rebuild-ver"),
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.5)", immediateRender: true },
        6.82
      );
      tl.to($("01-rebuild-tag"), { opacity: 1, duration: 0.5, ease: "power2.out" }, 7.3);

      window.__timelines["01-rebuild"] = tl;
    })();
  </script>
