          '<span class="05-excel-c4">' + r[3] + "</span>";
        rowsEl.appendChild(div);
      });

      // svg-path-draw setup — measured geometry, never guessed (slight overestimate per rule)
      var links = [$("05-excel-link0"), $("05-excel-link1"), $("05-excel-link2")];
      var linkLen = links.map(function (p) { return p.getTotalLength() * 1.05; });
      links.forEach(function (p, i) {
        p.style.strokeDasharray = String(linkLen[i]);
        p.style.strokeDashoffset = String(linkLen[i]);
      });
      var checks = [$("05-excel-chk0"), $("05-excel-chk1"), $("05-excel-chk2")];
      var chkLen = checks.map(function (p) { return p.getTotalLength() * 1.05; });
      checks.forEach(function (p, i) {
        p.style.strokeDasharray = String(chkLen[i]);
        p.style.strokeDashoffset = String(chkLen[i]);
      });

      var tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: DUR }, 0); // full-span anchor

      // ONE slow camera push underneath — stops dead at the Scene-4 hold
      tl.fromTo($("05-excel-cam"), { scale: 1 }, { scale: 1.022, duration: 6.0, ease: "none" }, 0);

      // Scene 1 (0.0–3.0) — workbench enters; badge lands; rows flow upward in three finite beats
      tl.fromTo(
        $("05-excel-table"),
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.035);
      tl.fromTo(
        $("05-excel-badge"),
        { opacity: 0, y: -16, scale: 0.9 },
        { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.5)" }, 0.199);
      tl.fromTo($("05-excel-outlabel"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.355);
      [0, 1, 2].forEach(function (i) {
        tl.fromTo(
          rowsEl,
          { y: -62 * i },
          { y: -62 * (i + 1), duration: 0.55, ease: "power2.inOut" },
          0.9 + i * 0.8
        );
      });

      // Scene 2 (3.0–4.0) — row counter: counting-dynamic-scale to 3,000
      //   final font size is static CSS; only transform scale grows (START_SCALE = 0.6)
      var countEl = $("05-excel-count");
      var cstate = { v: 0 };
      tl.to(
        cstate,
        {
          v: 3000,
          duration: 0.9,
          ease: "power3.out",
          onUpdate: function () {
            countEl.textContent = Math.round(cstate.v).toLocaleString("en-US");
          }
        }, 2.175);
      tl.fromTo(countEl, { scale: 0.6 }, { scale: 1, duration: 0.9, ease: "power3.out" }, 2.576);
      tl.fromTo(
        $("05-excel-ctr-unit"),
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 2.225);
      tl.fromTo($("05-excel-ctr-tag"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 2.702);

      // Scene 3 (4.0–6.0) — cards spring in; connectors draw table → card; receipts flip to mint
      var RC = [1024, 1008, 968]; // sums to the counted 3,000
      var POPS = [4.02, 4.52, 5.02];
      [0, 1, 2].forEach(function (i) {
        var t0 = POPS[i];
        tl.fromTo(
          $("05-excel-card" + i),
          { opacity: 0, y: 26, scale: 0.86 },
          { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.4)" },
          t0
        );
        // connector lands on real elements: table edge port → card left edge
        tl.fromTo(
          links[i],
          { strokeDashoffset: linkLen[i] },
          { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" },
          t0
        );
        tl.fromTo($("05-excel-port" + i), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, t0);
        // badge flip: numbered outline → solid mint circle + drawn dark check (the ONE voltage beat)
        var tf = t0 + 0.38;
        tl.fromTo(
          $("05-excel-bout" + i),
          { opacity: 1, scale: 1 },
          { opacity: 0, scale: 0.55, duration: 0.16, ease: "power2.in" },
          tf
        );
        tl.fromTo(
          $("05-excel-bsol" + i),
          { opacity: 0, scale: 0.4 },
          { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.9)" },
          tf + 0.06
        );
        tl.fromTo(
          checks[i],
          { strokeDashoffset: chkLen[i] },
          { strokeDashoffset: 0, duration: 0.24, ease: "power2.out" },
          tf + 0.18
        );
        tl.fromTo(
          $("05-excel-rlabel" + i),
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
          tf + 0.14
        );
        // mono row count — rapid tick-and-settle at fixed size (scale component suppressed)
        var rs = { v: 0 };
        var rEl = $("05-excel-rnum" + i);
        tl.to(
          rs,
          {
            v: RC[i],
            duration: 0.45,
            ease: "power1.out",
            onUpdate: function () {
              rEl.textContent = Math.round(rs.v).toLocaleString("en-US");
            }
          },
          tf + 0.14
        );
      });

      // Scene 4 (6.0–6.792) — static hold: three cards aligned, receipts all mint. No further motion.

      window.__timelines["05-excel"] = tl;
    })();
  </script>
</template>
