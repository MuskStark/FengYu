<template id="10-cta-template" data-composition-id="10-cta" data-width="1920" data-height="1080" data-duration="7.916">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  @font-face { font-family: "PingFang SC"; font-style: normal; font-weight: 100 900; src: local("PingFang SC"); }
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 400; font-display: block; src: url("assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 500; font-display: block; src: url("assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }

  #root {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: "PingFang SC", Georgia, serif;
  }

  /* full-bleed ground — dedicated clip layer, never painted on #root */
  .f10-ground {
    position: absolute;
    inset: 0;
    background: #0d0d0d;
  }
  .f10-world {
    position: absolute;
    inset: 0;
  }

  /* — Scene 1: centered brand lockup (~55% width) — */
  .f10-lockup {
    position: absolute;
    top: 272px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .f10-mark {
    width: 120px;
    height: 120px;
    margin-top: 12px;
    flex: none;
  }
  .f10-mark img {
    display: block;
    width: 100%;
    height: auto;
  }
  .f10-word {
    font-weight: 500;
    font-size: 140px;
    line-height: 1.05;
    letter-spacing: -0.022em;
    color: #ededed;
    white-space: nowrap;
  }
  .f10-w1, .f10-w2 { display: inline-block; }
  .f10-w2 { margin-left: 28px; }
  .f10-ver {
    margin-top: 24px;
    margin-left: 38px;
    height: 54px;
    padding: 0 26px;
    display: flex;
    align-items: center;
    background: #161616;
    border: 1px solid rgba(237, 237, 237, 0.16);
    border-radius: 9999px;
    perspective: 420px;
    flex: none;
  }
  .f10-ver-text {
    display: inline-block;
    min-width: 96px;
    text-align: center;
    font-family: "JetBrains Mono", monospace;
    font-weight: 500;
    font-size: 26px;
    letter-spacing: 0.04em;
    color: #ededed;
    white-space: nowrap;
  }

  /* — Scene 2: the one mint voltage — full-width band sweeping under the wordmark — */
  .f10-band {
    position: absolute;
    top: 468px;
    left: 0;
    width: 1920px;
    height: 12px;
    display: block;
  }
  .f10-band line {
    stroke: #8fd6bd;
    stroke-width: 12;
  }

  /* — Scene 3: $ chip that stretches into the wide navy terminal pill (focal) — */
  .f10-chip {
    position: absolute;
    top: 636px;
    left: 50%;
    margin-left: -70px;
    width: 140px;
    height: 88px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111413;
    border: 1px solid rgba(237, 237, 237, 0.14);
    border-radius: 9999px;
    font-family: "JetBrains Mono", monospace;
    font-weight: 500;
    font-size: 30px;
    color: rgba(237, 237, 237, 0.55);
  }
  .f10-pill {
    position: absolute;
    top: 590px;
    left: 50%;
    margin-left: -540px;
    width: 1080px;
    height: 180px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 72px;
    background: #111413;
    border: 1px solid rgba(237, 237, 237, 0.14);
    border-radius: 9999px;
  }
  .f10-pill-content {
    display: flex;
    flex-direction: column;
    gap: 18px;
    width: 100%;
  }
  .f10-cmd-row {
    display: flex;
    align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-weight: 400;
    font-size: 31px;
    color: #ededed;
  }
  .f10-prompt {
    margin-right: 14px;
    font-weight: 500;
    color: rgba(237, 237, 237, 0.45);
  }
  .f10-cmd-wrap {
    display: inline-flex;
    align-items: center;
    min-width: 764px; /* ≥ widest typed state — stops right-edge jitter */
    white-space: nowrap;
  }
  #f10-caret {
    display: inline-block;
    width: 10px;
    height: 36px;
    margin-left: 6px;
    background: #ededed;
  }
  .f10-out-row {
    display: flex;
    align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-weight: 400;
    font-size: 27px;
  }
  .f10-check {
    width: 22px;
    height: 22px;
    margin-right: 12px;
    flex: none;
  }
  .f10-check path {
    fill: none;
    stroke: #5db872;
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .f10-out-text {
    display: inline-block;
  }
  .f10-out-ok {
    color: #5db872;
    font-weight: 500;
    white-space: nowrap;
  }
  .f10-out-dim {
    color: rgba(237, 237, 237, 0.55);
    white-space: nowrap;
  }
</style>

<div id="root" data-composition-id="10-cta" data-width="1920" data-height="1080">
  <div class="clip f10-ground" data-start="0" data-duration="7.916" data-track-index="0"></div>

  <div class="clip f10-world" id="f10-world" data-start="0" data-duration="7.916" data-track-index="1">
    <!-- Scene 1 — brand lockup: drawn ✱ + per-word wordmark + flipping version tag -->
    <div class="f10-lockup">
      <div class="f10-mark" id="f10-mark" aria-hidden="true"><img src="assets/infinia-logo.svg" alt="Infinia"></div>
      <div class="f10-word"><span class="f10-w1" id="f10-w1">蜂语</span><span class="f10-w2" id="f10-w2">Infinia</span></div>
      <div class="f10-ver" id="f10-ver"><span class="f10-ver-text" id="f10-ver-text"></span></div>
    </div>

    <!-- Scene 2 — mint band sweeping left-to-right under the lockup -->
    <svg class="f10-band" width="1920" height="12" viewBox="0 0 1920 12" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <line id="f10-band-line" x1="0" y1="6" x2="1920" y2="6"></line>
    </svg>

    <!-- Scene 3 — $ chip stretches into the wide terminal pill; command types; output lands -->
    <div class="f10-chip" id="f10-chip">$</div>
    <div class="f10-pill" id="f10-pill">
      <div class="f10-pill-content" id="f10-pill-content">
        <div class="f10-cmd-row">
          <span class="f10-prompt">$</span>
          <span class="f10-cmd-wrap"><span id="f10-cmd-text"></span><span id="f10-caret"></span></span>
        </div>
        <div class="f10-out-row">
          <svg class="f10-check" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path id="f10-check-path" d="M 4 12 L 9 17 L 18 5"></path>
          </svg>
          <span class="f10-out-text" id="f10-out-text"><span class="f10-out-ok">v4.0.0 released</span><span class="f10-out-dim">&nbsp;— Ready to run</span></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    var DUR = 7.416;

    var tl = gsap.timeline({ paused: true });
    window.__timelines = window.__timelines || {};
    window.__timelines["10-cta"] = tl;

    /* — svg-path-draw setup: measure real geometry, never guess — */
    var bandLine = document.getElementById("f10-band-line");
    var bandLen = bandLine.getTotalLength();
    bandLine.style.strokeDasharray = String(bandLen);
    bandLine.style.strokeDashoffset = String(bandLen);
    var checkPath = document.getElementById("f10-check-path");
    var checkLen = checkPath.getTotalLength();
    checkPath.style.strokeDasharray = String(checkLen);
    checkPath.style.strokeDashoffset = String(checkLen);

    /* — macro move: one subtle drift under the reveal phases, locked for the hold — */
    tl.fromTo(
      "#f10-world",
      { scale: 1 },
      { scale: 1.015, duration: 5.6, ease: "power2.out" },
      0
    );

    /* — Scene 1 (0.0–2.2s): the real mark lands, wordmark per word, version flips in — */
    tl.fromTo(
      "#f10-mark",
      { opacity: 0, scale: 0.82 },
      { opacity: 1, scale: 1, duration: 0.85, ease: "power3.out" },
      0.08
    );
    tl.fromTo(
      "#f10-w1",
      { y: 30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
      0.40
    );
    tl.fromTo(
      "#f10-w2",
      { y: 30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
      0.62
    );
    tl.fromTo(
      "#f10-ver",
      { scale: 0.82, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.38, ease: "back.out(1.4)" },
      1.50
    );
    tl.fromTo(
      "#f10-ver-text",
      { rotationX: -92, opacity: 0 },
      { rotationX: 0, opacity: 1, duration: 0.42, ease: "power2.out" },
      1.70
    );

    /* — Scene 2 (2.2–3.2s): the one mint voltage — band sweeps left→right, stops where it lands — */
    tl.to("#f10-band-line", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 2.35);

    /* — Scene 3 (3.2–5.4s): $ chip springs in and stretches into the wide terminal pill — */
    tl.fromTo(
      "#f10-chip",
      { scale: 0.55, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(1.6)" },
      3.20
    );
    tl.fromTo(
      "#f10-pill",
      { scaleX: 0.1296, scaleY: 0.4889, opacity: 0 },
      { scaleX: 1, scaleY: 1, opacity: 1, duration: 0.46, ease: "power3.inOut" },
      3.55
    );
    tl.to("#f10-chip", { opacity: 0, duration: 0.16, ease: "power1.out" }, 3.55);
    tl.fromTo(
      "#f10-pill-content",
      { opacity: 0, y: 12 },
      { opacity: 1, y: 0, duration: 0.26, ease: "power2.out" },
      4.02
    );

    /* typing — smooth character slice (plain typing; discrete-text-sequence variation) */
    var CMD = "github.com/MuskStark/FengYu · Releases";
    var cmdEl = document.getElementById("f10-cmd-text");
    var typeState = { n: 0 };
    tl.to(
      typeState,
      {
        n: CMD.length,
        duration: 1.05,
        ease: "power1.inOut",
        onUpdate: function () {
          cmdEl.textContent = CMD.substring(0, Math.floor(typeState.n));
        },
      },
      4.10
    );

    /* output line lands: check stamp draws, text rises in */
    tl.to("#f10-check-path", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 5.22);
    tl.fromTo(
      "#f10-out-text",
      { opacity: 0, y: 8 },
      { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" },
      5.22
    );

    /* — master clock: version text via discrete-state reverse search + caret behavior —
       caret: solid through typing (t < 5.15), then the Scene-4 hold — low-amplitude
       blink (dims to 0.15, never fully off) with a barely-there x sway. Deterministic:
       pure functions of the timeline time. */
    var VER_SEQ = [
      { t: 0, text: "" },
      { t: 1.7, text: "v4.0.0" },
    ];
    function verAt(time) {
      for (var i = VER_SEQ.length - 1; i >= 0; i--) {
        if (time >= VER_SEQ[i].t) return VER_SEQ[i].text;
      }
      return "";
    }
    var verEl = document.getElementById("f10-ver-text");
    var caretEl = document.getElementById("f10-caret");
    var master = { t: 0 };
    tl.to(
      master,
      {
        t: DUR,
        duration: DUR,
        ease: "none",
        onUpdate: function () {
          verEl.textContent = verAt(master.t);
          if (master.t < 5.15) {
            caretEl.style.opacity = "1";
          } else {
            var blinkOn = Math.sin((master.t / 0.62) * Math.PI * 2) > 0;
            caretEl.style.opacity = blinkOn ? "1" : "0.15";
            caretEl.style.transform =
              "translateX(" + (Math.sin(master.t * 9.2) * 1.1).toFixed(2) + "px)";
          }
        },
      },
      0
    );
  })();
</script>
</template>
