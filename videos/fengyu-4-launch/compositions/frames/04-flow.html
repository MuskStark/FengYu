      var NODES = [
        { node: "04-flow-n1", wire: "04-flow-wire0", dot: "04-flow-dot0", badge: "04-flow-badge1", lab: "04-flow-lab1", no: "04-flow-no1", enter: 2.0 },
        { node: "04-flow-n2", wire: "04-flow-wire1", dot: "04-flow-dot1", badge: "04-flow-badge2", lab: "04-flow-lab2", no: "04-flow-no2", enter: 2.35 },
        { node: "04-flow-n3", wire: "04-flow-wire2", dot: "04-flow-dot2", badge: "04-flow-badge3", lab: "04-flow-lab3", no: "04-flow-no3", enter: 2.7 },
        { node: "04-flow-n4", wire: "04-flow-wire3", dot: "04-flow-dot3", badge: "04-flow-badge4", lab: "04-flow-lab4", no: "04-flow-no4", enter: 3.05 }
      ];
      var labs = [], metas = [], nos = [];
      NODES.forEach(function (r, i) {
        var wire = $(r.wire);
        var wLen = wire.getTotalLength();
        wire.style.strokeDasharray = String(wLen);
        wire.style.strokeDashoffset = String(wLen);

        var dot = $(r.dot);
        var dotDriver = { p: 0 };

        // node flies out of the written DSL to its slot
        tl.fromTo(
          $(r.node),
          { opacity: 0, scale: 0.9 },
          { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.5)", immediateRender: true },
          r.enter
        );

        // wires cascade on 连线@3.79, one dot per wire
        tl.to(wire, { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" }, 3.79 + i * 0.13);
        tl.to(
          dotDriver,
          {
            p: 1,
            duration: 0.32,
            ease: "power2.out",
            onStart: function () { dot.style.opacity = "1"; },
            onUpdate: function () {
              var pt = wire.getPointAtLength(dotDriver.p * wLen);
              dot.setAttribute("cx", pt.x);
              dot.setAttribute("cy", pt.y);
            },
            onComplete: function () { dot.style.opacity = "0"; }
          },
          3.82 + i * 0.13
        );

        // 执行@4.50 — the badges flip blue over the numbers
        tl.to($(r.no), { opacity: 0, duration: 0.12, ease: "power1.in" }, 4.5 + i * 0.12);
        tl.fromTo(
          $(r.badge),
          { opacity: 0, scale: 0.4, rotation: -30 },
          { opacity: 1, scale: 1, rotation: 0, duration: 0.36, ease: "back.out(2.1)", immediateRender: true },
          4.52 + i * 0.12
        );
        tl.to($(r.lab), { opacity: 0.62, duration: 0.4, ease: "power2.out" }, 4.6 + i * 0.12);

        labs.push($(r.lab));
        metas.push($(r.lab.replace("lab", "met")));
        nos.push($(r.no));
      });

      // — status bar: counter ticks and rail steps as each node lands, settles at 4/4
      var CSEQ = [
        { t: 0.0, s: "0/4" },
        { t: 2.06, s: "1/4" },
        { t: 2.41, s: "2/4" },
        { t: 2.76, s: "3/4" },
        { t: 3.11, s: "4/4" }
      ];
      var DONE_T = 4.5;
      var cntEl = $("04-flow-count");
      var cntDriver = { t: 0 };
      tl.to(
        cntDriver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            var t = cntDriver.t;
            cntEl.textContent = textAt(CSEQ, t);
            cntEl.style.color = t >= DONE_T ? "#2997ff" : "rgba(245,245,247,0.85)";
          }
        },
        0
      );
      var fill = $("04-flow-fill");
      tl.set(fill, { scaleX: 0 }, 0);
      tl.to(fill, { scaleX: 0.25, duration: 0.3, ease: "power2.out" }, 2.06);
      tl.to(fill, { scaleX: 0.5, duration: 0.3, ease: "power2.out" }, 2.41);
      tl.to(fill, { scaleX: 0.75, duration: 0.3, ease: "power2.out" }, 2.76);
      tl.to(fill, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 4.5);

      // — Scene 6 (4.3–6.2) — 「每一步都看得见」: the receipt. Count pops, chip
      //   「已完成」 springs in, the finished graph lifts once (one-time emphasis, no loop),
      //   then the frame holds still.
      tl.to(cntEl, { scale: 1.16, duration: 0.12, ease: "power1.out" }, 4.55);
      tl.to(cntEl, { scale: 1, duration: 0.22, ease: "power2.out" }, 4.67);
      tl.fromTo(
        $("04-flow-chip"),
        { opacity: 0, scale: 0.6, y: 8 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.8)", immediateRender: true },
        4.6
      );
      labs.forEach(function (lab) {
        tl.to(lab, { opacity: 0.88, duration: 0.6, ease: "power2.out" }, 5.05);
      });
      tl.to(metas, { opacity: 0.58, duration: 0.6, ease: "power2.out" }, 4.6);
      tl.to(nos, { opacity: 0.48, duration: 0.6, ease: "power2.out" }, 4.6);

      window.__timelines["04-flow"] = tl;
    })();
  </script>
</template>
