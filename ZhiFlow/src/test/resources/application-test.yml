# Test profile: provides an in-memory H2 datasource + JPA so APP-context tests
# (HeadlessIntegrationTest, VirtualUserInitializerTest, AppSettingRepositoryTest) can boot the
# full AiApplication context WITHOUT a real datasource.properties.
#
# NOTE: zhiflow.mode is intentionally NOT set to "app" here. Setting it would activate the
# conditional DataSourceAutoConfig (which builds a DataSource from datasource.properties that does
# not exist in tests -> throws) AND JpaConfig. Instead we let Spring Boot's own
# DataSourceAutoConfiguration build the H2 pool from spring.datasource.* below, and
# HibernateJpaAutoConfiguration build the EntityManagerFactory. The repository beans still get
# created via @EnableJpaRepositories on AiApplication, and AiConfigService / SecurityContext are
# unconditional beans, so the full APP context loads minus the production-only DataSource/Jpa
# conditionals.

spring:
  datasource:
    url: jdbc:h2:mem:zhiflowtest;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
