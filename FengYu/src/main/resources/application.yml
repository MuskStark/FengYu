# FengYu static configuration.
# Dynamic items (server.port, fengyu.auth.token) stay on the command line — they are
# per-launch values passed by the Tauri sidecar / dev runner. Only static defaults live here.

server:
  address: 127.0.0.1            # loopback only — never 0.0.0.0 (security invariant)

fengyu:
  store:
    # Infinia Store platform the host calls outbound (catalog, download, account).
    api-base: ${FENGYU_STORE_API_BASE:http://localhost:8080}
    # OAuth 2.1 PUBLIC client (RFC 8252 / RFC 7636): a distributed desktop app
    # cannot keep a client secret, so there is none — PKCE carries the proof.
    client-id: fengyu-desktop
    # Supply-chain defaults (design §8.3): downloads must carry an attested
    # SHA-256 and a platform Ed25519 signature trusted via trusted-store-keys.json.
    require-signature: true
    # Store/CDN URLs must be HTTPS (loopback excepted) and must not resolve into
    # private networks; only self-hosted LAN stores need this escape hatch.
    allow-private-network: false

spring:
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 128MB
  jpa:
    hibernate:
      ddl-auto: update          # entity changes auto-create tables / add columns
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Existing installs already have a ddl-auto-created schema and no flyway_schema_history:
    # baseline them at V1 instead of failing. Fresh installs run V1 (an empty baseline) from
    # zero. From V2 on, migrations are the versioned channel for what ddl-auto=update cannot
    # express (column renames/drops, data backfills) — see db/migration/V1__baseline.sql.
    baseline-on-migrate: true
    baseline-version: 1
    # Flyway runs BEFORE Hibernate's ddl-auto pass (Boot orders the EntityManagerFactory
    # after the Flyway initializer), so additive entity changes and V2+ migrations compose.

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  # Production usage export: point an OTLP collector at FengYu and per-run/per-tool
  # metrics (fengyu.agent.*) stream out automatically; with no URL configured the
  # OTLP registry stays dormant and metrics are readable at /actuator/metrics.
  # otlp:
  #   metrics:
  #     export:
  #       url: http://your-collector:4318/v1/metrics
  #       step: 60s
