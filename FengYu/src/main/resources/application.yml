# FengYu static configuration.
# Dynamic items (server.port, fengyu.auth.token) stay on the command line — they are
# per-launch values passed by the Electron sidecar / dev runner. Only static defaults live here.

server:
  address: 127.0.0.1            # loopback only — never 0.0.0.0 (security invariant)

fengyu:
  store:
    # Infinia Store platform the host calls outbound (catalog, download, account).
    # The default is the production store over HTTPS, so a fresh install works out of
    # the box; a store under local development overrides it via FENGYU_STORE_API_BASE
    # (loopback plain HTTP passes the URL policy) — or at runtime through the Settings
    # 升级渠道 (updateApiBase). Plugin installs/updates, cloud-account sign-in, and app
    # updates all route through that one channel (see StoreEndpointProvider, which warns
    # on a plain-HTTP non-loopback base).
    # The store API is served at the domain root (/api/v1/..., /oauth2/...); the
    # former /store path prefix no longer exists in production.
    api-base: ${FENGYU_STORE_API_BASE:https://www.infinia.fyi}
    # Desktop OAuth 2.1 client (RFC 8252 / RFC 7636). The default is the PUBLIC
    # client form — PKCE only, no shared secret: a secret baked into a
    # distributed desktop build is public knowledge, not a credential
    # (RFC 8252 §8.5). Deployments against a store that still registers
    # fengyu-desktop as CONFIDENTIAL opt in explicitly via
    # FENGYU_STORE_CLIENT_SECRET; long-term login for the public form needs a
    # store-side mechanism (per-install credentials or BFF), not a shipped secret.
    client-id: ${FENGYU_STORE_CLIENT_ID:fengyu-desktop}
    client-secret: ${FENGYU_STORE_CLIENT_SECRET:}
    # Supply-chain defaults (design §8.3): downloads must carry an attested
    # SHA-256 and a platform Ed25519 signature trusted via trusted-store-keys.json.
    require-signature: true
    # Store/CDN URLs must be HTTPS (loopback excepted) and must not resolve into
    # private networks. allow-private-network=true is the explicit escape hatch
    # for a self-hosted intranet/cross-site store — it permits private-network
    # targets AND plain HTTP towards them (such deployments rarely carry a
    # CA-signed certificate); public plain-HTTP stays rejected.
    allow-private-network: false
  agent:
    # Unattended runs (workflow schedules, webhook deliveries, AI background tasks) have no
    # stream client to answer an approval gate; the gate fails the run after this ceiling
    # instead of parking a background task slot until the 15-minute workflow timeout.
    # 0 disables the ceiling (not recommended for headless triggers).
    headless-approval-timeout-seconds: 300
    # Wall-clock ceiling for one dependency-ready DAG level of agent steps. A level that
    # overruns (a hung plugin tool, an unresponsive command) fails its steps and enters the
    # normal failure/replan path instead of blocking the run forever. 0 disables it.
    step-timeout-seconds: 900
  chat-resources:
    # Caps for chat attachments and the plugin file-grant bound that mirrors them
    # (ChatResourceLimits). Native picks are zero-copy live references since the desktop
    # calibration, so these are runaway guards, not storage budgets — hence the generous
    # defaults. Validated at startup: single ≤ tree ≤ scope, single ≤ 2 GB hard ceiling.
    max-single-file-bytes: 1GB
    max-tree-bytes: 2GB
    max-scope-bytes: 4GB
    # Reserved for tool-result artifact overflow (batch 2); claimed now so the key is stable.
    tool-artifacts-bytes: 1GB

spring:
  data:
    jpa:
      repositories:
        # Compile repository queries on first use. Flyway and Hibernate schema
        # initialization still finish before the application becomes ready.
        bootstrap-mode: lazy
  ai:
    mcp:
      client:
        # MCP handlers are registered explicitly by McpRuntimeManager; no annotated
        # client handlers exist. Avoid scanning every host bean during startup.
        annotation-scanner:
          enabled: false
  servlet:
    multipart:
      # Transport ceiling for chat-resource uploads, deliberately tighter than the semantic
      # scope cap: file = the 2 GB single-file hard ceiling (fengyu.chat-resources), request =
      # the 2 GB tree cap plus headroom for one directory upload's multipart framing. The
      # semantic layer enforces the precise per-scope caps; raising fengyu.chat-resources past
      # these values requires raising these too (they move together by contract).
      max-file-size: 2GB
      max-request-size: 3GB
  jpa:
    hibernate:
      ddl-auto: update          # entity changes auto-create tables / add columns
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Existing installs already have a ddl-auto-created schema and no flyway_schema_history:
    # baseline them at V1 instead of failing. Fresh installs run V1 (an empty baseline) from
    # zero. From V2 on, migrations are the versioned channel for what ddl-auto=update cannot
    # express (column renames/drops, data backfills) — see db/migration/V1__baseline.sql.
    baseline-on-migrate: true
    baseline-version: 1
    # Flyway runs BEFORE Hibernate's ddl-auto pass (Boot orders the EntityManagerFactory
    # after the Flyway initializer), so additive entity changes and V2+ migrations compose.

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  # Production usage export: point an OTLP collector at FengYu and per-run/per-tool
  # metrics (fengyu.agent.*) stream out automatically; with no URL configured the
  # OTLP registry stays dormant and metrics are readable at /actuator/metrics.
  # otlp:
  #   metrics:
  #     export:
  #       url: http://your-collector:4318/v1/metrics
  #       step: 60s
