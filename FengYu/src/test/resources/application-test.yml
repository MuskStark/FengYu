# Test profile: provides an in-memory H2 datasource + JPA (ddl-auto) so APP-context tests
# (HeadlessIntegrationTest, VirtualUserInitializerTest, AppSettingRepositoryTest) can boot the
# full AiApplication context WITHOUT a real datasource.properties.
#
# NOTE: fengyu.mode is intentionally NOT set to "app" here. Setting it would activate the
# conditional APP-mode DataSourceAutoConfig (which builds a DataSource from a
# datasource.properties that does not exist in tests -> throws). Instead we let Spring Boot's own
# DataSourceAutoConfiguration build the H2 pool from spring.datasource.* below, and
# HibernateJpaAutoConfiguration build the EntityManagerFactory (with ddl-auto below). Hibernate
# auto-detects the H2 dialect from the JDBC metadata. The repository beans still get created via
# @EnableJpaRepositories on AiApplication, and AiConfigService / SecurityContext are unconditional
# beans, so the full APP context loads minus the production-only DataSource conditional.

spring:
  datasource:
    url: jdbc:h2:mem:fengyutest;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
